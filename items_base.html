<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База предметов — Королевство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:   #d4a843;
  --gold-l: #f5d878;
  --gold-d: #a07d2b;
  --bg:     #0b0907;
  --bg2:    #120e09;
  --bg3:    #1a160f;
  --bg4:    #211810;
  --line:   rgba(212,168,67,.09);
  --line2:  rgba(212,168,67,.18);
  --txt:    #ece4cf;
  --txt2:   #a99775;
  --txt3:   #6c5d44;
  --serif:  'Fraunces', Georgia, serif;
  --sans:   'Inter', system-ui, sans-serif;
  --sidebar-w: 220px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.top{
  height:56px;padding:0 24px;
  border-bottom:1px solid var(--line);
  background:rgba(11,9,7,.9);backdrop-filter:blur(20px);
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:18px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:26px;height:26px;filter:drop-shadow(0 0 8px rgba(212,168,67,.4))}
.logo-n{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.01em}
.nav{margin-left:20px;display:flex;gap:2px}
.nav a{padding:6px 11px;border-radius:6px;font-size:13px;color:var(--txt2);font-weight:500;transition:background .12s,color .12s}
.nav a:hover{color:var(--txt);background:var(--bg2)}
.nav a.on{color:var(--gold-l);background:var(--bg3)}
.h-back{margin-left:auto;font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:5px;transition:color .15s}
.h-back:hover{color:var(--gold-l)}
.h-back::before{content:'←'}

/* ── LAYOUT ── */
.layout{
  display:flex;
  margin-top:56px;
  min-height:calc(100vh - 56px);
}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--line);
  position:sticky;top:56px;
  height:calc(100vh - 56px);
  overflow-y:auto;
  padding:16px 0 40px;
}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:rgba(212,168,67,.15);border-radius:2px}

/* section group */
.sb-group{margin-bottom:4px}
.sb-group-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;cursor:pointer;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--txt3);transition:color .15s;user-select:none;
}
.sb-group-header:hover{color:var(--txt2)}
.sb-group-header.open{color:var(--gold-d)}
.sb-chevron{font-size:9px;transition:transform .2s;opacity:.6}
.sb-group-header.open .sb-chevron{transform:rotate(90deg)}

.sb-items{display:none}
.sb-items.open{display:block}

.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 16px 7px 20px;cursor:pointer;
  font-size:13px;color:var(--txt2);
  transition:background .12s,color .12s;
  border-left:2px solid transparent;
}
.sb-item:hover{background:var(--bg3);color:var(--txt)}
.sb-item.on{background:var(--bg3);color:var(--gold-l);border-left-color:var(--gold)}

.sb-ico{
  width:16px;height:16px;border-radius:3px;flex-shrink:0;
  background:var(--bg4);border:1px solid var(--line2);
}
.sb-item.on .sb-ico{border-color:rgba(212,168,67,.3);background:rgba(212,168,67,.08)}

.sb-solo{
  display:flex;align-items:center;
  padding:8px 16px;cursor:pointer;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--txt3);transition:background .12s,color .15s;
  border-left:2px solid transparent;
}
.sb-solo:hover{background:var(--bg3);color:var(--txt2)}
.sb-solo.on{background:var(--bg3);color:var(--gold-l);border-left-color:var(--gold)}

/* ── CONTENT ── */
.content{
  flex:1;min-width:0;
  padding:32px 36px 80px;
}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:300px;gap:12px;color:var(--txt3);
  font-family:var(--serif);font-size:17px;font-style:italic;
}
.empty-state svg{opacity:.15}

.c-title{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:-.015em;margin-bottom:6px}
.c-sub{font-size:11px;color:var(--txt3);margin-bottom:24px;letter-spacing:.1em;text-transform:uppercase}

/* quality tabs */
.q-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:24px}
.q-tab{
  padding:9px 13px;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--txt3);
  transition:color .15s,border-color .15s;
}
.q-tab:hover{color:var(--txt2)}
.q-tab.on{border-bottom-color:var(--gold);color:var(--gold-l)}
.q-tab[data-q="white"].on      {border-bottom-color:#bbb;color:#ccc}
.q-tab[data-q="green"].on      {border-bottom-color:#6aaa40;color:#8acc60}
.q-tab[data-q="blue"].on       {border-bottom-color:#4888cc;color:#78aae0}
.q-tab[data-q="purple"].on     {border-bottom-color:#9060cc;color:#b888ee}
.q-tab[data-q="purple_plus"].on{border-bottom-color:#c070e0;color:#d898f8}
.q-tab[data-q="red"].on        {border-bottom-color:#cc3030;color:#ee5050}
.q-tab[data-q="orange"].on     {border-bottom-color:#cc7020;color:#f0a040}

/* item table */
.item-table{width:100%;border-collapse:collapse}
.item-table th{
  padding:9px 14px;text-align:right;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt3);font-weight:600;border-bottom:1px solid var(--line);
}
.item-table th:first-child{text-align:left}
.item-table td{padding:11px 14px;border-bottom:1px solid rgba(212,168,67,.04);font-family:var(--serif);font-size:14px}
.item-table tr:last-child td{border-bottom:none}
.item-table tr:hover td{background:rgba(212,168,67,.025)}
.slot-name{color:var(--txt2);font-weight:500;display:flex;align-items:center;gap:10px}
.slot-ico{width:20px;height:20px;border-radius:3px;background:var(--bg4);border:1px solid var(--line);flex-shrink:0}
.stat-val{color:var(--txt);font-feature-settings:'tnum';text-align:right}
.stat-empty{color:var(--txt3);text-align:right;font-size:13px}

/* rune list */
.rune-list{display:flex;flex-direction:column;gap:2px}
.rune-row{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;border-radius:8px;
  border:1px solid transparent;
  transition:background .12s,border-color .12s;
}
.rune-row:hover{background:var(--bg2);border-color:var(--line)}
.rune-ico{width:34px;height:34px;border-radius:3px;background:var(--bg4);flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}

.ico-img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.ico-frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rune-info{flex:1;min-width:0}
.rune-name{font-family:var(--serif);font-size:15px;font-weight:500;margin-bottom:3px}
.rune-meta{font-size:11px;color:var(--txt3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.06em;font-family:var(--sans)}
.q-badge.white {background:rgba(200,200,200,.1);color:#bbb}
.q-badge.green  {background:rgba(106,170,64,.15);color:#8acc60}
.q-badge.blue   {background:rgba(72,136,204,.15);color:#78aae0}
.q-badge.purple {background:rgba(144,96,204,.15);color:#b888ee}
.q-badge.red    {background:rgba(204,48,48,.15);color:#ee5050}
.q-badge.orange {background:rgba(204,112,32,.15);color:#f0a040}

.soon-block{padding:32px;border:1px dashed var(--line2);border-radius:10px;color:var(--txt3);font-family:var(--serif);font-style:italic;font-size:16px;text-align:center}

/* sidebar divider + sub-items */
.sb-divider{height:1px;background:var(--line);margin:6px 12px}
.sb-sub{padding-left:28px !important;font-size:12px;letter-spacing:0}
.sb-group-header.on{color:var(--gold-l) !important}

/* class tabs in content */
.cls-tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:20px}
.cls-tab{
  display:flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:7px;cursor:pointer;
  font-size:13px;color:var(--txt2);font-weight:500;
  transition:background .12s,color .12s;
}
.cls-tab:hover{background:var(--bg3);color:var(--txt)}
.cls-tab.on{background:var(--bg3);color:var(--gold-l)}
.cls-tab-ico{width:16px;height:16px;border-radius:2px;flex-shrink:0}

/* equipment card grid */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:4px}
.eq-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:14px 10px 12px;
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  transition:border-color .15s,background .15s;
}
.eq-card:hover{border-color:var(--line2);background:var(--bg3)}
.eq-card .rune-ico{width:32px;height:32px}
.eq-card .ico-img{object-fit:none;width:32px;height:32px}
.eq-slot-name{font-size:11px;color:var(--txt3);text-align:center;line-height:1.3}
.eq-no-img{width:32px;height:32px;background:var(--bg4);border-radius:4px;border:1px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:10px;opacity:.4}

/* buff cards */
.buff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ring-quad-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:4px}
.ring-quad-header{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);text-align:center;padding:4px 0}
.buff-card{
  display:flex;flex-direction:row;align-items:center;gap:12px;
  padding:12px 14px;
  background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  transition:border-color .15s,background .15s;cursor:default;
}
.buff-card:hover{border-color:var(--line2);background:var(--bg3)}
.buff-card.special{border-color:rgba(212,168,67,.2);background:rgba(212,168,67,.04)}
.buff-ico{width:32px;height:32px;flex-shrink:0}
.buff-ico img{display:block;width:32px;height:32px}
.buff-card .rune-ico{width:32px;height:32px;flex-shrink:0}
.buff-card .ico-img{width:32px;height:32px;object-fit:none}
.buff-text{flex:1;min-width:0}
.jewel-section-head{
  font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em;
  color:var(--gold-l);margin:32px 0 12px;padding-bottom:10px;
  border-bottom:1px solid var(--line2);
}
.jewel-section-head:first-child{margin-top:4px}
.art-section-divider{
  display:flex;align-items:center;gap:12px;
  margin:24px 0 14px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:700;color:var(--txt3);
}
.art-section-divider::before,.art-section-divider::after{
  content:'';flex:1;height:1px;background:var(--line);
}
/* all item names wrap, never truncate */
.buff-name,.rune-name,.eq-slot-name,.c-title{overflow-wrap:break-word;word-break:normal;white-space:normal}
.buff-name{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--txt);line-height:1.3}
.buff-cls{font-size:11px;color:var(--txt3);margin-top:2px}
.eq-card:hover{cursor:default;border-color:var(--line2);background:var(--bg3)}

/* item tooltip */
.eq-tt{
  position:fixed;z-index:300;pointer-events:none;display:none;
  background:var(--bg3);border:1px solid var(--line2);border-radius:8px;
  padding:12px 14px;min-width:210px;
  box-shadow:0 8px 28px rgba(0,0,0,.5);
}
.eq-tt.vis{display:block}
.tt-name{font-family:var(--serif);font-size:14px;font-weight:500;margin-bottom:9px;color:var(--txt)}
.tt-row{display:flex;justify-content:space-between;gap:16px;padding:3px 0;font-size:12px;border-bottom:1px solid var(--line)}
.tt-row:last-child{border-bottom:none}
.tt-key{color:var(--txt2)}
.tt-val{color:var(--txt);white-space:nowrap;font-feature-settings:'tnum'}
.tt-empty{color:var(--txt3);font-size:12px;font-style:italic}

/* ── MOBILE ── */
@media(max-width:700px){
  .top{padding:0 16px}
  .nav{display:none}
  .sidebar{position:static;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .layout{flex-direction:column}
  .content{padding:20px 16px 60px}
}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="index_new.html">
    <img src="kor_logo.svg" alt="">
    <div class="logo-n">Korolevstvo</div>
  </a>
  <nav class="nav">
    <a href="index_new.html">Главная</a>
    <a class="on" href="items_base.html">База предметов</a>
    <a href="stats_calc.html">Характеристики</a>
    <a>Гайды<span style="font-size:10px;color:var(--txt3);margin-left:4px">скоро</span></a>
    <a>Сообщество</a>
  </nav>
  <a class="h-back" href="index_new.html">На главную</a>
</header>

<div class="layout">

  <!-- ── SIDEBAR ── -->
  <nav class="sidebar">

    <div class="sb-group">
      <div class="sb-group-header open" onclick="toggleGroup(this)">
        Экипировка <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-items open">
        <div class="sb-item sb-sub" data-view="equipment" onclick="show(this)">Основная экипировка</div>
        <div class="sb-item sb-sub" data-view="jewelry" onclick="show(this)">Бижутерия</div>
        <div class="sb-item sb-sub" data-view="artifacts" onclick="show(this)">Артефакты</div>
        <div class="sb-item sb-sub" data-view="event_equipment" onclick="show(this)">Ивентовая экипировка</div>
        <div class="sb-item sb-sub" data-view="runes" onclick="show(this)">Руны</div>
      </div>
    </div>

    <div class="sb-group">
      <div class="sb-group-header" onclick="toggleGroup(this)">
        Бафы <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-items">
        <div class="sb-item" data-view="buffs_class" onclick="show(this)">
          <div class="sb-ico"></div>Классовые бафы
        </div>
        <div class="sb-item" data-view="buffs_event" onclick="show(this)">
          <div class="sb-ico"></div>Ивентовые бафы
        </div>
      </div>
    </div>

    <div class="sb-group">
      <div class="sb-group-header" onclick="toggleGroup(this)">
        Питомцы <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-items">
        <div class="sb-item" data-view="pets_fair" onclick="show(this)">
          <div class="sb-ico"></div>Ярмарочные питомцы
        </div>
        <div class="sb-item" data-view="pets_deco" onclick="show(this)">
          <div class="sb-ico"></div>Декоративные питомцы
        </div>
      </div>
    </div>

  </nav>

  <!-- ── CONTENT ── -->
  <div class="content" id="content">
    <div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="32" height="32" rx="4" stroke="currentColor" stroke-width="2"/><path d="M16 24h16M24 16v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Выбери раздел слева
    </div>
  </div>

</div>

<script src="data.js"></script>
<script>
const SLOTS = [
  { id:'weapon',    name:'Оружие' },
  { id:'pants',     name:'Штаны' },
  { id:'belt',      name:'Пояс' },
  { id:'boots',     name:'Сапоги' },
  { id:'gloves',    name:'Перчатки' },
  { id:'shoulders', name:'Наплечники' },
  { id:'chest',     name:'Нагрудник' },
  { id:'helm',      name:'Шлем' },
  { id:'offhand',   name:'Второе оружие' },
];

function icoHtml(img, quality) {
  const frame = QUALITY_FRAME[quality] || '';
  return `<div class="rune-ico">` +
    `<img class="ico-img" src="${img}" alt="" onerror="this.style.opacity=0">` +
    (frame ? `<img class="ico-frame" src="${frame}" alt="">` : '') +
    `</div>`;
}
const RUNES = [
  { name:'Титанитовая Великая Руна Фальдира',   slot:'Оружие',        quality:'red',    img:'stats_calculator/rune/rune_weapon.png' },
  { name:'Руна Пяти Камней',                    slot:'Второе оружие', quality:'red',    img:'stats_calculator/rune/rune_attack_weapon2_1.png' },
  { name:'Титанитовая Великая Руна Гэтана',     slot:'Штаны',         quality:'red',    img:'stats_calculator/rune/rune_pants.png' },
  { name:'Великая Руна Варин',                  slot:'Пояс',          quality:'red',    img:'stats_calculator/rune/rune_belt.png' },
  { name:'Великая Руна Орноса',                 slot:'Сапоги',        quality:'red',    img:'stats_calculator/rune/rune_boots.png' },
  { name:'Титанитовая Великая Руна Баннора',    slot:'Перчатки',      quality:'red',    img:'stats_calculator/rune/rune_gloves.png' },
  { name:'Титанитовая Великая Руна Халиэмы',   slot:'Наплечники',    quality:'red',    img:'stats_calculator/rune/rune_shoulders.png' },
  { name:'Великая Руна Мехила',                 slot:'Нагрудник',     quality:'red',    img:'stats_calculator/rune/rune_chest.png' },
  { name:'Руна Хенгиста',                       slot:'Амулет',        quality:'purple', img:'stats_calculator/rune/rune_medallion_attack_10.png' },
  { name:'Руна Усиленной Защиты Хорлата',       slot:'Шлем',          quality:'blue',   img:'stats_calculator/rune/rune_helm_defense_5.png' },
  { name:'Руна Усиленной Атаки Хорлата',        slot:'Шлем',          quality:'blue',   img:'stats_calculator/rune/rune_helm_attack_5.png' },
  { name:'Руна Усиленного Здоровья Хорлата',    slot:'Шлем',          quality:'blue',   img:'stats_calculator/rune/rune_helm_health_5.png' },
];

let activeQ   = 'purple';
let activeCls = 'warrior';

/* префикс "Усиленный/Усиленные" по названию предмета */
const УСИЛ = {
  'Меч':'Усиленный',     'Щит':'Усиленный',     'Шлем':'Усиленный',
  'Нагрудник':'Усиленный','Пояс':'Усиленный',    'Молот':'Усиленный',
  'Посох':'Усиленный',   'Орб':'Усиленный',      'Кинжал':'Усиленный',
  'Лук':'Усиленный',     'Колчан':'Усиленный',
  'Наплечники':'Усиленные','Штаны':'Усиленные',  'Перчатки':'Усиленные',
  'Сапоги':'Усиленные',
};

function clearActive() {
  document.querySelectorAll('.sb-item').forEach(e => e.classList.remove('on'));
}

function toggleGroup(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function show(el) {
  clearActive();
  el.classList.add('on');
  render(el.dataset.view);
}

function render(view) {
  const c = document.getElementById('content');
  if (view === 'equipment')     renderEquipment(c);
  else if (view === 'runes')      renderRunes(c);
  else if (view === 'jewelry')    renderJewelry(c);
  else if (view === 'event_equipment') renderEventEquipment(c);
  else if (view === 'artifacts')  renderArtifacts(c);
  else if (view === 'buffs_class')  renderBuffsClass(c);
  else if (view === 'buffs_event')  renderEventBuffs(c);
  else if (view === 'pets_fair')   renderSoon(c, 'Ярмарочные питомцы');
  else if (view === 'pets_deco')   renderSoon(c, 'Декоративные питомцы');
}

function renderEquipment(c) {
  const clsTabs = Object.entries(CLASS_NAMES).map(([id, name]) =>
    `<div class="cls-tab${activeCls===id?' on':''}" onclick="switchCls('${id}')">` +
    `<img class="cls-tab-ico" src="stats_calculator/classes/${CLASS_ICON_FILE[id]}" onerror="this.style.display='none'">${name}</div>`
  ).join('');

  const qTabs = QUALITIES.map(q =>
    `<div class="q-tab${activeQ===q.id?' on':''}" data-q="${q.id}" onclick="switchQ('${q.id}')">${q.label}</div>`
  ).join('');

  const setName = CLASS_SET_NAMES[activeCls]?.[activeQ] || '';
  const cards = SLOTS.map(slot => {
    const img = getItemImg(activeCls, slot.id, activeQ);
    const hasData = !!(STATS[activeCls]?.[activeQ]?.[slot.id]);
    let ico;
    if (img) {
      ico = icoHtml(img, activeQ);
    } else if (hasData) {
      const frame = QUALITY_FRAME[activeQ] || '';
      ico = `<div class="rune-ico">${frame ? `<img class="ico-frame" src="${frame}" style="position:static;width:32px;height:32px">` : ''}</div>`;
    } else {
      ico = `<div class="eq-no-img"></div>`;
    }
    const baseName = CLASS_ITEM_NAMES[activeCls]?.[slot.id] || slot.name;
    const prefix = activeQ === 'purple_plus' ? (УСИЛ[baseName] || 'Усиленный') + ' ' : '';
    const itemName = setName ? `${prefix}${baseName} ${setName}` : `${prefix}${baseName}`;
    return `<div class="eq-card" onmouseenter="ttShow('${activeCls}','${slot.id}','${activeQ}','${itemName}',event)" onmousemove="ttMove(event)" onmouseleave="ttHide()">${ico}<div class="eq-slot-name">${itemName}</div></div>`;
  }).join('');

  c.innerHTML = `
    <div class="c-title">Основная экипировка</div>
    <div class="cls-tabs">${clsTabs}</div>
    <div class="q-tabs">${qTabs}</div>
    <div class="eq-grid">${cards}</div>`;
}

function switchCls(cls) {
  activeCls = cls;
  renderEquipment(document.getElementById('content'));
}

function switchQ(q) {
  activeQ = q;
  const view = document.querySelector('.sb-item.on')?.dataset.view;
  if (view) render(view);
}

function renderRunes(c) {
  const qlabels = Object.fromEntries(QUALITIES.map(q => [q.id, q.label]));
  const rows = RUNES.map(r => `
    <div class="rune-row">
      ${icoHtml(r.img, r.quality)}
      <div class="rune-info">
        <div class="rune-name">${r.name}</div>
        <div class="rune-meta">
          <span class="rune-slot">${r.slot}</span>
        </div>
      </div>
    </div>`).join('');

  c.innerHTML = `
    <div class="c-title">Руны</div>
    <div class="c-sub">Наложение на экипировку</div>
    <div class="rune-list">${rows}</div>`;
}


const CLASS_BUFFS = [
  { name:'Зоркий глаз',   cls:'Лучник',    quality:'green', effect:'+15% наносимый урон',      img:'stats_calculator/buffs/class_buff/skill_alert_eye.png' },
  { name:'Ураган',        cls:'Маг',       quality:'green', effect:'+15% наносимый урон',      img:'stats_calculator/buffs/class_buff/skill_hurricane.png' },
  { name:'Благословение', cls:'Монах',     quality:'green', effect:'+8% запас здоровья',       img:'stats_calculator/buffs/class_buff/skill_regeneration.png' },
  { name:'Святое слово',  cls:'Паладин',   quality:'green', effect:'+8% запас здоровья',       img:'stats_calculator/buffs/class_buff/skill_sacred_word.png' },
  { name:'Пылающий щит', cls:'Воин',      quality:'green', effect:'-8% получаемый урон',      img:'stats_calculator/buffs/class_buff/skill_elemental_shield.png' },
  { name:'Дар теней',    cls:'Головорез', quality:'green', effect:'-8% получаемый урон',      img:'stats_calculator/buffs/class_buff/skill_shadow_gift.png' },
];

const WITCH_FLAME = {
  name:'Ведьмин огонь', quality:'green',
  effects:['+30% наносимый урон', '-16% получаемый урон', '+16% запас здоровья'],
  note:'Заменяет все классовые бафы — нельзя использовать вместе с ними',
  img:'stats_calculator/buffs/class_buff/acid_flame.png'
};

function renderBuffsClass(c) {
  const cards = CLASS_BUFFS.map((b, i) => `
    <div class="buff-card" onmouseenter="ttShowBuff(${i},event)" onmousemove="ttMove(event)" onmouseleave="ttHide()">
      ${icoHtml(b.img, b.quality)}
      <div class="buff-text">
        <div class="buff-name">${b.name}</div>
        <div class="buff-cls">${b.cls}</div>
      </div>
    </div>`).join('');

  const wf = WITCH_FLAME;
  const wfCard = `
    <div class="buff-card special" onmouseenter="ttShowWF(event)" onmousemove="ttMove(event)" onmouseleave="ttHide()">
      ${icoHtml(wf.img, wf.quality)}
      <div class="buff-text"><div class="buff-name">${wf.name}</div></div>
    </div>`;

  c.innerHTML = `
    <div class="c-title">Классовые бафы</div>
    <div class="buff-grid">${cards}${wfCard}</div>`;
}

function renderArtifacts(c) {
  function artCard(art, i) {
    return `<div class="buff-card" onmouseenter="ttShowArt(${i},event)" onmousemove="ttMove(event)" onmouseleave="ttHide()">
      ${icoHtml(art.img, art.quality)}
      <div class="buff-text"><div class="buff-name">${art.name}</div></div>
    </div>`;
  }

  const GROUP_ORDER = ['Камень Ведьмака','Камень Удачи','Камень Потерянных Земель','Камень Труда','Камень Дружбы','Камень Крови'];
  const idxOf  = a => ARTIFACTS.indexOf(a);
  // Только каменные слоты — не смешиваем с кольцами/браслетами/прочим
  const stones = ARTIFACTS.filter(a => a.slotId?.startsWith('stone_'));
  const unique = sortByQuality(stones.filter(a => !a.group));

  let html = `<div class="c-title">Артефакты</div><div class="buff-grid">${unique.map(a => artCard(a, idxOf(a))).join('')}</div>`;

  for (const g of GROUP_ORDER) {
    const items = sortByQuality(stones.filter(a => a.group === g));
    if (items.length) {
      html += `<div class="art-section-divider">${g}</div>
               <div class="buff-grid">${items.map(a => artCard(a, idxOf(a))).join('')}</div>`;
    }
  }

  c.innerHTML = html;
}

function renderJewelry(c) {
  const idxOf = a => ARTIFACTS.indexOf(a);

  function jewCard(art) {
    const q = QUALITIES.find(q2 => q2.id === art.quality);
    return `<div class="buff-card" onmouseenter="ttShowArt(${idxOf(art)},event)" onmousemove="ttMove(event)" onmouseleave="ttHide()">
      ${icoHtml(art.img, art.quality)}
      <div class="buff-text"><div class="buff-name">${art.name}</div></div>
    </div>`;
  }

  function section(title, slotId, groupOrder, pairGroups) {
    const items = ARTIFACTS.filter(a => a.slotId === slotId && !a.event);
    if (!items.length) return '';
    let html = `<div class="jewel-section-head">${title}</div>`;
    if (groupOrder) {
      const ungrouped = sortByQuality(items.filter(a => !a.group));
      if (ungrouped.length) html += `<div class="buff-grid">${ungrouped.map(jewCard).join('')}</div>`;
      for (const g of groupOrder) {
        const grp = sortByQuality(items.filter(a => a.group === g));
        const gridCls = pairGroups && pairGroups.includes(g) ? 'pair-grid' : 'buff-grid';
        if (grp.length) html += `<div class="art-section-divider">${g}</div><div class="${gridCls}">${grp.map(jewCard).join('')}</div>`;
      }
    } else {
      const ungrouped = sortByQuality(items.filter(a => !a.group));
      const groups = [...new Set(items.filter(a => a.group).map(a => a.group))];
      if (ungrouped.length) html += `<div class="buff-grid">${ungrouped.map(jewCard).join('')}</div>`;
      for (const g of groups) {
        const grp = sortByQuality(items.filter(a => a.group === g));
        html += `<div class="art-section-divider">${g}</div><div class="buff-grid">${grp.map(jewCard).join('')}</div>`;
      }
    }
    return html;
  }

  function ringPair(g1, g2) {
    const i1 = sortByQuality(ARTIFACTS.filter(a => a.slotId === 'ring' && a.group === g1 && !a.event));
    const i2 = sortByQuality(ARTIFACTS.filter(a => a.slotId === 'ring' && a.group === g2 && !a.event));
    if (!i1.length && !i2.length) return '';
    return `<div class="ring-quad-grid">
      <div class="ring-quad-header" style="grid-column:1/3">${g1}</div>
      <div class="ring-quad-header" style="grid-column:3/5">${g2}</div>
      ${i1.map(jewCard).join('')}${i2.map(jewCard).join('')}
    </div>`;
  }

  const ringUngrouped = sortByQuality(ARTIFACTS.filter(a => a.slotId === 'ring' && !a.group && !a.event));
  c.innerHTML = `<div class="c-title">Бижутерия</div>
    <div class="jewel-section-head">Кольца</div>
    ${ringPair('Кольцо сквайра', 'Кольцо рыцаря')}
    ${ringPair('Кольцо лорда', 'Кольцо барона')}
    ${ringUngrouped.length ? `<div class="buff-grid">${ringUngrouped.map(jewCard).join('')}</div>` : ''}
    ${section('Браслеты',  'bracelet')}
    ${section('Амулеты',   'amulet')}
    ${section('Трофеи',    'trophy')}
    ${section('Брелоки',   'trinket')}
    ${section('Жетоны',    'badge')}
    ${section('Талисманы', 'talisman')}`;
}

function renderEventBuffs(c) {
  const idxOf = b => EVENT_BUFFS.indexOf(b);
  function buffCard(b) {
    return `<div class="buff-card" onmouseenter="ttShowEventBuff(${idxOf(b)},event)" onmousemove="ttMove(event)" onmouseleave="ttHide()">
      ${icoHtml(b.img, b.quality)}
      <div class="buff-text"><div class="buff-name">${b.name}</div></div>
    </div>`;
  }
  const groups = [...new Set(EVENT_BUFFS.map(b => b.group))];
  let html = `<div class="c-title">Ивентовые бафы</div>`;
  for (const g of groups) {
    const items = sortByQuality(EVENT_BUFFS.filter(b => b.group === g));
    html += `<div class="art-section-divider">${g}</div><div class="buff-grid">${items.map(buffCard).join('')}</div>`;
  }
  c.innerHTML = html;
}

function renderEventEquipment(c) {
  const idxOf = a => ARTIFACTS.indexOf(a);
  // Ивентовые предметы — всё кроме камней + предметы из бижутерии с флагом event:true
  const JEWELRY_SLOTS = ['ring','bracelet','amulet','trophy','trinket','badge','talisman'];
  const eventItems = ARTIFACTS.filter(a => a.slotId && !a.slotId.startsWith('stone_') &&
    (!JEWELRY_SLOTS.includes(a.slotId) || a.event));

  function evCard(art) {
    return `<div class="buff-card" onmouseenter="ttShowArt(${idxOf(art)},event)" onmousemove="ttMove(event)" onmouseleave="ttHide()">
      ${icoHtml(art.img, art.quality)}
      <div class="buff-text"><div class="buff-name">${art.name}</div></div>
    </div>`;
  }

  if (!eventItems.length) { renderSoon(c, 'Ивентовая экипировка'); return; }

  // Группируем по slotId-группе или названию группы
  const groups = [...new Set(eventItems.map(a => a.group || a.name))];
  let html = `<div class="c-title">Ивентовая экипировка</div>`;
  const ungrouped = sortByQuality(eventItems.filter(a => !a.group));
  if (ungrouped.length) html += `<div class="buff-grid">${ungrouped.map(evCard).join('')}</div>`;
  for (const g of [...new Set(eventItems.filter(a => a.group).map(a => a.group))]) {
    const grp = sortByQuality(eventItems.filter(a => a.group === g));
    html += `<div class="art-section-divider">${g}</div><div class="buff-grid">${grp.map(evCard).join('')}</div>`;
  }
  c.innerHTML = html;
}

function renderSoon(c, title) {
  c.innerHTML = `
    <div class="c-title">${title}</div>
    <div class="c-sub" style="margin-bottom:24px">Скоро</div>
    <div class="soon-block">Данные добавляются</div>`;
}

const _tt = document.createElement('div');
_tt.className = 'eq-tt';
document.body.appendChild(_tt);

function ttShow(cls, slotId, quality, itemName, e) {
  const stats = STATS[cls]?.[quality]?.[slotId];
  let html = `<div class="tt-name">${itemName}</div>`;
  if (!stats) {
    html += `<div class="tt-empty">Данные не добавлены</div>`;
  } else {
    html += STAT_LABELS
      .filter(s => stats[s.key] != null)
      .map(s => {
        const v = stats[s.key];
        return `<div class="tt-row"><span class="tt-key">${s.label}</span><span class="tt-val">+${v}${s.pct?'%':''}</span></div>`;
      }).join('');
  }
  _tt.innerHTML = html;
  _tt.classList.add('vis');
  ttMove(e);
}
function ttShowBuff(idx, e) {
  const b = CLASS_BUFFS[idx];
  _tt.innerHTML = `<div class="tt-name">${b.name}</div>
    <div class="tt-row"><span class="tt-key">${b.cls}</span><span class="tt-val">${b.effect}</span></div>`;
  _tt.classList.add('vis');
  ttMove(e);
}
function ttShowWF(e) {
  const wf = WITCH_FLAME;
  let html = `<div class="tt-name">${wf.name}</div>`;
  html += wf.effects.map(ef => `<div class="tt-row"><span class="tt-key" style="color:var(--txt2)">${ef}</span></div>`).join('');
  html += `<div class="tt-row" style="margin-top:4px"><span class="tt-key" style="font-style:italic;color:var(--txt3)">${wf.note}</span></div>`;
  _tt.innerHTML = html;
  _tt.classList.add('vis');
  ttMove(e);
}
function ttShowArt(idx, e) {
  const art = ARTIFACTS[idx];
  let html = `<div class="tt-name">${art.name}</div>`;
  if (art.stats) {
    html += STAT_LABELS
      .filter(s => art.stats[s.key] != null)
      .map(s => `<div class="tt-row"><span class="tt-key">${s.label}</span><span class="tt-val">+${art.stats[s.key]}${s.pct?'%':''}</span></div>`)
      .join('');
  } else {
    html += `<div class="tt-empty">Данные не добавлены</div>`;
  }
  _tt.innerHTML = html;
  _tt.classList.add('vis');
  ttMove(e);
}
function ttShowEventBuff(idx, e) {
  const b = EVENT_BUFFS[idx];
  const q = QUALITIES.find(q2 => q2.id === b.quality);
  let html = `<div class="tt-name">${b.name}</div>`;
  if (q) html += `<div class="tt-row"><span class="tt-key" style="color:${q.color}">${q.label}</span></div>`;
  if (b.stats) {
    html += STAT_LABELS.filter(s => b.stats[s.key] != null)
      .map(s => `<div class="tt-row"><span class="tt-key">${s.label}</span><span class="tt-val">+${b.stats[s.key]}${s.pct?'%':''}</span></div>`)
      .join('');
  } else {
    html += `<div class="tt-empty">Данные не добавлены</div>`;
  }
  _tt.innerHTML = html;
  _tt.classList.add('vis');
  ttMove(e);
}
function ttMove(e) {
  const x = e.clientX + 14, y = e.clientY + 14;
  _tt.style.left = Math.min(x, window.innerWidth  - _tt.offsetWidth  - 8) + 'px';
  _tt.style.top  = Math.min(y, window.innerHeight - _tt.offsetHeight - 8) + 'px';
}
function ttHide() { _tt.classList.remove('vis'); }

function sv(val, suffix='') {
  return val == null
    ? `<td class="stat-empty">—</td>`
    : `<td class="stat-val">${val}${suffix}</td>`;
}
</script>
