<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База предметов — Королевство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:   #d4a843;
  --gold-l: #f5d878;
  --gold-d: #a07d2b;
  --bg:     #0b0907;
  --bg2:    #120e09;
  --bg3:    #1a160f;
  --bg4:    #211810;
  --line:   rgba(212,168,67,.09);
  --line2:  rgba(212,168,67,.18);
  --txt:    #ece4cf;
  --txt2:   #a99775;
  --txt3:   #6c5d44;
  --serif:  'Fraunces', Georgia, serif;
  --sans:   'Inter', system-ui, sans-serif;
  --sidebar-w: 220px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.top{
  height:56px;padding:0 24px;
  border-bottom:1px solid var(--line);
  background:rgba(11,9,7,.9);backdrop-filter:blur(20px);
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:18px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:26px;height:26px;filter:drop-shadow(0 0 8px rgba(212,168,67,.4))}
.logo-n{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.01em}
.nav{margin-left:20px;display:flex;gap:2px}
.nav a{padding:6px 11px;border-radius:6px;font-size:13px;color:var(--txt2);font-weight:500;transition:background .12s,color .12s}
.nav a:hover{color:var(--txt);background:var(--bg2)}
.nav a.on{color:var(--gold-l);background:var(--bg3)}
.h-back{margin-left:auto;font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:5px;transition:color .15s}
.h-back:hover{color:var(--gold-l)}
.h-back::before{content:'←'}

/* ── LAYOUT ── */
.layout{
  display:flex;
  margin-top:56px;
  min-height:calc(100vh - 56px);
}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--line);
  position:sticky;top:56px;
  height:calc(100vh - 56px);
  overflow-y:auto;
  padding:16px 0 40px;
}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:rgba(212,168,67,.15);border-radius:2px}

/* section group */
.sb-group{margin-bottom:4px}
.sb-group-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;cursor:pointer;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--txt3);transition:color .15s;user-select:none;
}
.sb-group-header:hover{color:var(--txt2)}
.sb-group-header.open{color:var(--gold-d)}
.sb-chevron{font-size:9px;transition:transform .2s;opacity:.6}
.sb-group-header.open .sb-chevron{transform:rotate(90deg)}

.sb-items{display:none}
.sb-items.open{display:block}

.sb-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 16px 7px 20px;cursor:pointer;
  font-size:13px;color:var(--txt2);
  transition:background .12s,color .12s;
  border-left:2px solid transparent;
}
.sb-item:hover{background:var(--bg3);color:var(--txt)}
.sb-item.on{background:var(--bg3);color:var(--gold-l);border-left-color:var(--gold)}

.sb-ico{
  width:16px;height:16px;border-radius:3px;flex-shrink:0;
  background:var(--bg4);border:1px solid var(--line2);
}
.sb-item.on .sb-ico{border-color:rgba(212,168,67,.3);background:rgba(212,168,67,.08)}

.sb-solo{
  display:flex;align-items:center;
  padding:8px 16px;cursor:pointer;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  color:var(--txt3);transition:background .12s,color .15s;
  border-left:2px solid transparent;
}
.sb-solo:hover{background:var(--bg3);color:var(--txt2)}
.sb-solo.on{background:var(--bg3);color:var(--gold-l);border-left-color:var(--gold)}

/* ── CONTENT ── */
.content{
  flex:1;min-width:0;
  padding:32px 36px 80px;
}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:300px;gap:12px;color:var(--txt3);
  font-family:var(--serif);font-size:17px;font-style:italic;
}
.empty-state svg{opacity:.15}

.c-title{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:-.015em;margin-bottom:6px}
.c-sub{font-size:11px;color:var(--txt3);margin-bottom:24px;letter-spacing:.1em;text-transform:uppercase}

/* quality tabs */
.q-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:24px}
.q-tab{
  padding:9px 13px;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--txt3);
  transition:color .15s,border-color .15s;
}
.q-tab:hover{color:var(--txt2)}
.q-tab.on{border-bottom-color:var(--gold);color:var(--gold-l)}
.q-tab[data-q="white"].on      {border-bottom-color:#bbb;color:#ccc}
.q-tab[data-q="green"].on      {border-bottom-color:#6aaa40;color:#8acc60}
.q-tab[data-q="blue"].on       {border-bottom-color:#4888cc;color:#78aae0}
.q-tab[data-q="purple"].on     {border-bottom-color:#9060cc;color:#b888ee}
.q-tab[data-q="purple_plus"].on{border-bottom-color:#c070e0;color:#d898f8}
.q-tab[data-q="red"].on        {border-bottom-color:#cc3030;color:#ee5050}
.q-tab[data-q="orange"].on     {border-bottom-color:#cc7020;color:#f0a040}

/* item table */
.item-table{width:100%;border-collapse:collapse}
.item-table th{
  padding:9px 14px;text-align:right;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt3);font-weight:600;border-bottom:1px solid var(--line);
}
.item-table th:first-child{text-align:left}
.item-table td{padding:11px 14px;border-bottom:1px solid rgba(212,168,67,.04);font-family:var(--serif);font-size:14px}
.item-table tr:last-child td{border-bottom:none}
.item-table tr:hover td{background:rgba(212,168,67,.025)}
.slot-name{color:var(--txt2);font-weight:500;display:flex;align-items:center;gap:10px}
.slot-ico{width:20px;height:20px;border-radius:3px;background:var(--bg4);border:1px solid var(--line);flex-shrink:0}
.stat-val{color:var(--txt);font-feature-settings:'tnum';text-align:right}
.stat-empty{color:var(--txt3);text-align:right;font-size:13px}

/* rune list */
.rune-list{display:flex;flex-direction:column;gap:2px}
.rune-row{
  display:flex;align-items:center;gap:14px;
  padding:12px 14px;border-radius:8px;
  border:1px solid transparent;
  transition:background .12s,border-color .12s;
}
.rune-row:hover{background:var(--bg2);border-color:var(--line)}
.rune-ico{width:34px;height:34px;border-radius:3px;background:var(--bg4);flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}

.ico-img{width:100%;height:100%;object-fit:cover;border-radius:3px}
.ico-frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rune-info{flex:1;min-width:0}
.rune-name{font-family:var(--serif);font-size:15px;font-weight:500;margin-bottom:3px}
.rune-meta{font-size:11px;color:var(--txt3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.06em;font-family:var(--sans)}
.q-badge.white {background:rgba(200,200,200,.1);color:#bbb}
.q-badge.green  {background:rgba(106,170,64,.15);color:#8acc60}
.q-badge.blue   {background:rgba(72,136,204,.15);color:#78aae0}
.q-badge.purple {background:rgba(144,96,204,.15);color:#b888ee}
.q-badge.red    {background:rgba(204,48,48,.15);color:#ee5050}
.q-badge.orange {background:rgba(204,112,32,.15);color:#f0a040}

.soon-block{padding:32px;border:1px dashed var(--line2);border-radius:10px;color:var(--txt3);font-family:var(--serif);font-style:italic;font-size:16px;text-align:center}

/* ── MOBILE ── */
@media(max-width:700px){
  .top{padding:0 16px}
  .nav{display:none}
  .sidebar{position:static;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .layout{flex-direction:column}
  .content{padding:20px 16px 60px}
}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="index_new.html">
    <img src="kor_logo.svg" alt="">
    <div class="logo-n">Korolevstvo</div>
  </a>
  <nav class="nav">
    <a href="index_new.html">Калькуляторы</a>
    <a class="on" href="items_base.html">База предметов</a>
    <a>Гайды<span style="font-size:10px;color:var(--txt3);margin-left:4px">скоро</span></a>
    <a>Сообщество</a>
  </nav>
  <a class="h-back" href="index_new.html">На главную</a>
</header>

<div class="layout">

  <!-- ── SIDEBAR ── -->
  <nav class="sidebar">

    <div class="sb-group">
      <div class="sb-group-header open" onclick="toggleGroup(this)">
        Экипировка <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-items open">
        <div class="sb-item" data-view="warrior" onclick="show(this)">
          <div class="sb-ico"></div>Воин
        </div>
        <div class="sb-item" data-view="rogue" onclick="show(this)">
          <div class="sb-ico"></div>Головорез
        </div>
        <div class="sb-item" data-view="monk" onclick="show(this)">
          <div class="sb-ico"></div>Монах
        </div>
        <div class="sb-item" data-view="paladin" onclick="show(this)">
          <div class="sb-ico"></div>Паладин
        </div>
        <div class="sb-item" data-view="mage" onclick="show(this)">
          <div class="sb-ico"></div>Маг
        </div>
        <div class="sb-item" data-view="archer" onclick="show(this)">
          <div class="sb-ico"></div>Лучник
        </div>
      </div>
    </div>

    <div class="sb-solo" data-view="jewelry" onclick="show(this)">Бижутерия</div>
    <div class="sb-solo" data-view="artifacts" onclick="show(this)">Артефакты</div>
    <div class="sb-solo" data-view="runes" onclick="show(this)">Руны</div>

    <div class="sb-group">
      <div class="sb-group-header" onclick="toggleGroup(this)">
        Бафы <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-items">
        <div class="sb-item" data-view="buffs_class" onclick="show(this)">
          <div class="sb-ico"></div>Классовые бафы
        </div>
      </div>
    </div>

    <div class="sb-group">
      <div class="sb-group-header" onclick="toggleGroup(this)">
        Питомцы <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-items">
        <div class="sb-item" data-view="pets_fair" onclick="show(this)">
          <div class="sb-ico"></div>Ярмарочные питомцы
        </div>
        <div class="sb-item" data-view="pets_deco" onclick="show(this)">
          <div class="sb-ico"></div>Декоративные питомцы
        </div>
      </div>
    </div>

  </nav>

  <!-- ── CONTENT ── -->
  <div class="content" id="content">
    <div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="32" height="32" rx="4" stroke="currentColor" stroke-width="2"/><path d="M16 24h16M24 16v16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Выбери раздел слева
    </div>
  </div>

</div>

<script>
const SLOTS = [
  { id:'weapon',    name:'Оружие' },
  { id:'helm',      name:'Шлем' },
  { id:'chest',     name:'Нагрудник' },
  { id:'shoulders', name:'Наплечники' },
  { id:'pants',     name:'Штаны' },
  { id:'gloves',    name:'Перчатки' },
  { id:'belt',      name:'Пояс' },
  { id:'boots',     name:'Сапоги' },
  { id:'offhand',   name:'Второе оружие' },
];

const CLASS_NAMES = {
  warrior:'Воин', rogue:'Головорез', monk:'Монах',
  paladin:'Паладин', mage:'Маг', archer:'Лучник'
};

const QUALITIES = [
  { id:'white',       label:'Белое' },
  { id:'green',       label:'Зелёное' },
  { id:'blue',        label:'Синее' },
  { id:'purple',      label:'Фиолетовое' },
  { id:'purple_plus', label:'Фиол.+' },
  { id:'red',         label:'Красное' },
  { id:'orange',      label:'Оранжевое' },
];

const ITEMS = {
  warrior:{}, rogue:{}, monk:{}, paladin:{}, mage:{}, archer:{}
};


const QUALITY_FRAME = {
  white:       'frames/border_none.png',
  green:       'frames/border_low.png',
  blue:        'frames/border_medium.png',
  purple:      'frames/border_high.png',
  purple_plus: 'frames/border_high.png',
  red:         'frames/border_exclusive.png',
  orange:      'frames/border_special.png',
};
function icoHtml(img, quality) {
  const frame = QUALITY_FRAME[quality] || '';
  return `<div class="rune-ico">` +
    `<img class="ico-img" src="${img}" alt="" onerror="this.style.opacity=0">` +
    (frame ? `<img class="ico-frame" src="${frame}" alt="">` : '') +
    `</div>`;
}
const RUNES = [
  { name:'Титанитовая Великая Руна Фальдира',   slot:'Оружие',        quality:'red',    img:'stats_calculator/rune/rune_weapon.png' },
  { name:'Руна Пяти Камней',                    slot:'Второе оружие', quality:'red',    img:'stats_calculator/rune/rune_attack_weapon2_1.png' },
  { name:'Титанитовая Великая Руна Гэтана',     slot:'Штаны',         quality:'red',    img:'stats_calculator/rune/rune_pants.png' },
  { name:'Великая Руна Варин',                  slot:'Пояс',          quality:'red',    img:'stats_calculator/rune/rune_belt.png' },
  { name:'Великая Руна Орноса',                 slot:'Сапоги',        quality:'red',    img:'stats_calculator/rune/rune_boots.png' },
  { name:'Титанитовая Великая Руна Баннора',    slot:'Перчатки',      quality:'red',    img:'stats_calculator/rune/rune_gloves.png' },
  { name:'Титанитовая Великая Руна Халиэмы',   slot:'Наплечники',    quality:'red',    img:'stats_calculator/rune/rune_shoulders.png' },
  { name:'Великая Руна Мехила',                 slot:'Нагрудник',     quality:'red',    img:'stats_calculator/rune/rune_chest.png' },
  { name:'Руна Хенгиста',                       slot:'Амулет',        quality:'purple', img:'stats_calculator/rune/rune_medallion_attack_10.png' },
  { name:'Руна Усиленной Защиты Хорлата',       slot:'Шлем',          quality:'blue',   img:'stats_calculator/rune/rune_helm_defense_5.png' },
  { name:'Руна Усиленной Атаки Хорлата',        slot:'Шлем',          quality:'blue',   img:'stats_calculator/rune/rune_helm_attack_5.png' },
  { name:'Руна Усиленного Здоровья Хорлата',    slot:'Шлем',          quality:'blue',   img:'stats_calculator/rune/rune_helm_health_5.png' },
];

let activeQ = 'purple';

function toggleGroup(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function show(el) {
  document.querySelectorAll('.sb-item, .sb-solo').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
  render(el.dataset.view);
}

function render(view) {
  const c = document.getElementById('content');
  const classes = ['warrior','rogue','monk','paladin','mage','archer'];
  if (classes.includes(view))     renderClass(c, view);
  else if (view === 'runes')      renderRunes(c);
  else if (view === 'jewelry')    renderSoon(c, 'Бижутерия');
  else if (view === 'artifacts')  renderSoon(c, 'Артефакты');
  else if (view === 'buffs_class') renderBuffsClass(c);
  else if (view === 'pets_fair')   renderSoon(c, 'Ярмарочные питомцы');
  else if (view === 'pets_deco')   renderSoon(c, 'Декоративные питомцы');
}

function renderClass(c, cls) {
  const tabs = QUALITIES.map(q =>
    `<div class="q-tab${activeQ===q.id?' on':''}" data-q="${q.id}" onclick="switchQ('${q.id}')">${q.label}</div>`
  ).join('');

  const rows = SLOTS.map(slot => {
    const item = ITEMS[cls][slot.id]?.[activeQ];
    return `<tr>
      <td><div class="slot-name"><div class="slot-ico"></div>${slot.name}</div></td>
      ${sv(item?.atk)}${sv(item?.def)}${sv(item?.hp)}${sv(item?.crit_chance,'%')}${sv(item?.crit_dmg)}
    </tr>`;
  }).join('');

  c.innerHTML = `
    <div class="c-title">${CLASS_NAMES[cls]}</div>
    <div class="c-sub">Основная экипировка</div>
    <div class="q-tabs">${tabs}</div>
    <table class="item-table">
      <thead><tr>
        <th>Слот</th><th>Атака</th><th>Защита</th><th>Здоровье</th><th>Крит %</th><th>Крит сила</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function switchQ(q) {
  activeQ = q;
  document.querySelectorAll('.q-tab').forEach(t => t.classList.toggle('on', t.dataset.q === q));
  // перерисовываем только строки
  const view = document.querySelector('.sb-item.on')?.dataset.view;
  if (view) render(view);
}

function renderRunes(c) {
  const qlabels = Object.fromEntries(QUALITIES.map(q => [q.id, q.label]));
  const rows = RUNES.map(r => `
    <div class="rune-row">
      ${icoHtml(r.img, r.quality)}
      <div class="rune-info">
        <div class="rune-name">${r.name}</div>
        <div class="rune-meta">
          <span class="rune-slot">${r.slot}</span>
        </div>
      </div>
    </div>`).join('');

  c.innerHTML = `
    <div class="c-title">Руны</div>
    <div class="c-sub">Наложение на экипировку</div>
    <div class="rune-list">${rows}</div>`;
}


const CLASS_BUFFS = [
  { name:'Зоркий глаз',   cls:'Лучник',    quality:'green', effect:'+15% наносимый урон',      img:'stats_calculator/buffs/class_buff/skill_alert_eye.png' },
  { name:'Ураган',        cls:'Маг',       quality:'green', effect:'+15% наносимый урон',      img:'stats_calculator/buffs/class_buff/skill_hurricane.png' },
  { name:'Благословение', cls:'Монах',     quality:'green', effect:'+8% запас здоровья',       img:'stats_calculator/buffs/class_buff/skill_regeneration.png' },
  { name:'Святое слово',  cls:'Паладин',   quality:'green', effect:'+8% запас здоровья',       img:'stats_calculator/buffs/class_buff/skill_sacred_word.png' },
  { name:'Пылающий щит', cls:'Воин',      quality:'green', effect:'-8% получаемый урон',      img:'stats_calculator/buffs/class_buff/skill_elemental_shield.png' },
  { name:'Дар теней',    cls:'Головорез', quality:'green', effect:'-8% получаемый урон',      img:'stats_calculator/buffs/class_buff/skill_shadow_gift.png' },
];

const WITCH_FLAME = {
  name:'Ведьмин огонь', quality:'green',
  effects:['+30% наносимый урон', '-16% получаемый урон', '+16% запас здоровья'],
  note:'Заменяет все классовые бафы — нельзя использовать вместе с ними',
  img:'stats_calculator/buffs/class_buff/acid_flame.png'
};

function renderBuffsClass(c) {
  const qlabels = Object.fromEntries(QUALITIES.map(q => [q.id, q.label]));

  const rows = CLASS_BUFFS.map(b => `
    <div class="rune-row">
      ${icoHtml(b.img, b.quality)}
      <div class="rune-info">
        <div class="rune-name">${b.name}</div>
        <div class="rune-meta">
          <span class="rune-slot">${b.cls}</span>
          <span style="color:var(--txt2)">${b.effect}</span>
        </div>
      </div>
    </div>`).join('');

  const wf = WITCH_FLAME;
  const wfEffects = wf.effects.map(e => `<span style="color:var(--txt2)">${e}</span>`).join('');

  c.innerHTML = `
    <div class="c-title">Классовые бафы</div>
    <div class="rune-list">${rows}</div>

    <div style="margin-top:28px"></div>
    <div class="rune-row" style="border:1px solid rgba(212,168,67,.15);background:rgba(212,168,67,.04);border-radius:8px">
      ${icoHtml(wf.img, wf.quality)}
      <div class="rune-info">
        <div class="rune-name">${wf.name}</div>
        <div class="rune-meta" style="flex-direction:column;align-items:flex-start;gap:4px">
          <div style="display:flex;gap:10px;flex-wrap:wrap">${wfEffects}</div>
          <div style="color:var(--txt3);font-style:italic">${wf.note}</div>
        </div>
      </div>
    </div>`;
}

function renderSoon(c, title) {
  c.innerHTML = `
    <div class="c-title">${title}</div>
    <div class="c-sub" style="margin-bottom:24px">Скоро</div>
    <div class="soon-block">Данные добавляются</div>`;
}

function sv(val, suffix='') {
  return val == null
    ? `<td class="stat-empty">—</td>`
    : `<td class="stat-val">${val}${suffix}</td>`;
}
</script>
</body>
</html>
