<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карты локаций — Королевство</title>
<style>
  :root {
    --gold:   #e8b84b;
    --gold-l: #fce87a;
    --gold-d: #b8912e;
    --gold-tint: 232,184,75;
    --bg:   #0f0c08;
    --bg2:  #181208;
    --bg3:  #221a0e;
    --bg4:  #2c2010;
    --line: rgba(var(--gold-tint),.14);
    --line2:rgba(var(--gold-tint),.28);
    --txt:  #f5ecd8;
    --txt2: #c8a96e;
    --txt3: #8a7250;
    --serif:'Georgia',serif;
    --sans: 'Inter',system-ui,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  html, body { height:100%; background:var(--bg); color:var(--txt); font-family:var(--sans); font-size:14px }

  /* ── Top bar ── */
  .top {
    padding:14px 32px;
    border-bottom:1px solid var(--line);
    background:rgba(11,9,7,.85);
    backdrop-filter:blur(20px);
    display:flex; align-items:center; gap:16px;
  }
  .top-title { font-family:var(--serif); font-size:18px; font-weight:600; color:var(--gold); letter-spacing:.02em }
  .top-back { font-size:12px; color:var(--txt3); padding:5px 10px; border-radius:5px; text-decoration:none; transition:.12s }
  .top-back:hover { color:var(--gold-l); background:var(--bg3) }

  /* ── Layout ── */
  .layout { display:flex; height:calc(100vh - 53px) }

  /* ── Sidebar ── */
  .sidebar {
    width:220px; flex-shrink:0;
    background:var(--bg2); border-right:1px solid var(--line);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .sb-head { padding:16px 18px 10px; font-size:10px; color:var(--txt3); letter-spacing:.18em; text-transform:uppercase; font-weight:600 }
  .sb-item {
    padding:10px 18px; cursor:pointer; font-size:13px; color:var(--txt2);
    border-left:2px solid transparent; transition:.12s;
    display:flex; align-items:center; gap:10px;
  }
  .sb-item:hover { color:var(--txt); background:var(--bg3) }
  .sb-item.on { color:var(--gold-l); border-left-color:var(--gold); background:rgba(var(--gold-tint),.06) }
  .sb-lvl {
    font-size:10px; padding:2px 5px; border-radius:3px;
    background:var(--bg4); color:var(--txt3); font-weight:600;
    margin-left:auto; flex-shrink:0;
  }
  .sb-item.on .sb-lvl { color:var(--gold-d) }

  /* ── Main ── */
  .main {
    flex:1; display:flex; flex-direction:column; overflow:hidden;
  }

  /* ── Controls ── */
  .controls {
    padding:14px 24px; border-bottom:1px solid var(--line);
    background:var(--bg2);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .ctrl-label { font-size:11px; color:var(--txt3); letter-spacing:.1em; text-transform:uppercase; font-weight:600 }
  .coord-group { display:flex; align-items:center; gap:8px }
  .coord-input {
    width:90px; padding:7px 10px;
    background:var(--bg3); border:1px solid var(--line2);
    border-radius:6px; color:var(--txt); font-size:14px;
    font-family:monospace; outline:none; transition:.12s;
  }
  .coord-input:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(var(--gold-tint),.12) }
  .coord-sep { color:var(--txt3); font-size:16px }
  .btn-find {
    padding:7px 18px; background:rgba(var(--gold-tint),.12);
    border:1px solid var(--gold-d); border-radius:6px;
    color:var(--gold-l); font-size:13px; font-weight:600;
    cursor:pointer; transition:.12s; outline:none;
  }
  .btn-find:hover { background:rgba(var(--gold-tint),.22); border-color:var(--gold) }
  .coord-hint { font-size:11px; color:var(--txt3); font-style:italic; margin-left:4px }

  /* ── Map area ── */
  .map-area {
    flex:1; display:flex; align-items:center; justify-content:center;
    overflow:auto; padding:24px;
    background:radial-gradient(ellipse 60% 60% at 50% 50%, rgba(var(--gold-tint),.03), transparent 70%), var(--bg);
  }
  .map-wrap {
    position:relative; display:inline-block;
    border:1px solid var(--line2);
    box-shadow:0 0 40px rgba(0,0,0,.6), 0 0 0 1px rgba(var(--gold-tint),.08);
    border-radius:4px; overflow:hidden;
  }
  #map-img {
    display:block;
    image-rendering:pixelated;
  }
  #map-canvas {
    position:absolute; inset:0; pointer-events:none;
  }

  /* ── Info bar ── */
  .info-bar {
    padding:8px 24px; border-top:1px solid var(--line);
    background:var(--bg2); font-size:11px; color:var(--txt3);
    display:flex; align-items:center; gap:20px;
  }
  .info-item { display:flex; align-items:center; gap:6px }
  .info-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0 }
  .info-dot.player { background:#ff4444; box-shadow:0 0 6px #ff4444 }
  .info-dot.border { background:rgba(var(--gold-tint),.6) }

  /* ── Zoom controls ── */
  .zoom-controls {
    position:absolute; bottom:16px; right:16px;
    display:flex; flex-direction:column; gap:4px; z-index:10;
  }
  .zoom-btn {
    width:28px; height:28px; background:rgba(15,12,8,.85);
    border:1px solid var(--line2); border-radius:4px;
    color:var(--txt2); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.12s; outline:none;
  }
  .zoom-btn:hover { border-color:var(--gold); color:var(--gold-l) }

  /* ── Checkbox toggle ── */
  .ctrl-toggle {
    display:flex; align-items:center; gap:7px;
    cursor:pointer; font-size:13px; color:var(--txt2);
    padding:4px 0; user-select:none;
  }
  .ctrl-toggle input { display:none }
  .ctrl-toggle .chk-box {
    width:16px; height:16px; border-radius:3px;
    border:1px solid var(--line2); background:var(--bg3);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:.12s;
  }
  .ctrl-toggle input:checked + .chk-box {
    border-color:var(--gold-d); background:rgba(var(--gold-tint),.15);
  }
  .ctrl-toggle input:checked + .chk-box::after {
    content:''; display:block;
    width:8px; height:8px; border-radius:50%;
    background:var(--gold);
  }
  .ctrl-div { width:1px; height:20px; background:var(--line); flex-shrink:0 }

  /* ── Tooltip локации ── */
  .loc-tooltip {
    position:fixed; z-index:100; pointer-events:none; display:none;
    padding:5px 11px; border-radius:5px;
    background:rgba(11,9,7,.88); border:1px solid rgba(var(--gold-tint),.35);
    backdrop-filter:blur(6px);
    font-size:12px; color:var(--txt); white-space:nowrap;
  }

  /* ── No map state ── */
  .no-map {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; gap:12px; color:var(--txt3); font-family:var(--serif); font-style:italic;
  }
</style>

let scale = 1;
let border = [];
let worldBounds = { minX:0, maxX:1, minY:0, maxY:1 };

// ── Парсинг границ ───────────────────────────────────────────────────────────
function parseBorder(str) {
  return str.split(';').map(p => {
    const [x, y] = p.split(',').map(Number);
    return { x, y };
  });
}

function calcBounds(pts) {
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  return {
    minX: Math.min(...xs), maxX: Math.max(...xs),
    minY: Math.min(...ys), maxY: Math.max(...ys),
  };
}

// ── Обратное преобразование: пиксель → игровые координаты ───────────────────
function pixelToWorld(px, py, r) {
  if (r.affine) {
    const { a, b, c, d, e, f } = r.affine;
    const det = a * e - b * d;
    if (Math.abs(det) < 1e-9) return null;
    const gx = (e * (px - c) - b * (py - f)) / det;
    const gy = (a * (py - f) - d * (px - c)) / det;
    return { gx: Math.round(gx), gy: Math.round(gy) };
  }
  return null;
}

// ── Преобразование координат ─────────────────────────────────────────────────
function worldToPixel(wx, wy, r) {
  if (r.affine) {
    // Аффинное преобразование: px = a·gx + b·gy + c,  py = d·gx + e·gy + f
    // Общий случай изометрии — не предполагает симметрию осей
    const { a, b, c, d, e, f } = r.affine;
    return {
      px: a*wx + b*wy + c,
      py: d*wx + e*wy + f,
    };
  }
  if (r.iso) {
    // Строгая изометрия (запасной вариант)
    const { Sx, Ox, Sy, Oy } = r.iso;
    return {
      px: (wx + wy) * Sx + Ox,
      py: (wx - wy) * Sy + Oy,
    };
  }
  // Ортогональный fallback для других регионов
  const b2 = r.bounds || worldBounds;
  const left   = b2.left   ?? b2.minX;
  const right  = b2.right  ?? b2.maxX;
  const top    = b2.top    ?? b2.maxY;
  const bottom = b2.bottom ?? b2.minY;
  const px = (wx - left)  / (right - left)  * r.imgW;
  const py = (top  - wy)  / (top   - bottom) * r.imgH;
  return { px, py };
}

// ── Загрузка региона ─────────────────────────────────────────────────────────
function selectRegion(id) {
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('on'));
  document.querySelector(`.sb-item[data-id="${id}"]`).classList.add('on');

  const r = REGIONS[id];
  if (!r) {
    document.getElementById('no-map').style.display = 'flex';
    document.getElementById('map-wrap').style.display = 'none';
    document.getElementById('coord-status').textContent = 'Карта этой локации ещё не добавлена';
    return;
  }

  document.getElementById('no-map').style.display = 'none';
  document.getElementById('map-wrap').style.display = 'inline-block';

  currentRegion = id;
  border = r.border ? parseBorder(r.border) : [];
  worldBounds = border.length ? calcBounds(border) : { minX:0, maxX:1, minY:0, maxY:1 };
  scale = 1;

  const img = document.getElementById('map-img');
  const canvas = document.getElementById('map-canvas');

  img.onload = () => {
    canvas.width  = r.imgW;
    canvas.height = r.imgH;
    img.width  = r.imgW;
    img.height = r.imgH;
    drawMap();
  };
  img.src = r.img;
}

// ── Отрисовка ────────────────────────────────────────────────────────────────
function drawMap() {
  const r = REGIONS[currentRegion];
  if (!r) return;

  const canvas = document.getElementById('map-canvas');
  canvas.width  = r.imgW * scale;
  canvas.height = r.imgH * scale;
  document.getElementById('map-img').width  = r.imgW * scale;
  document.getElementById('map-img').height = r.imgH * scale;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const s = scale;

  // Позиция игрока (только после поиска)
  let inBounds = false;
  if (playerSearched) {
    const { px, py } = worldToPixel(playerX, playerY, r);
    const cx = px * s, cy = py * s;
    inBounds = px >= 0 && px <= r.imgW && py >= 0 && py <= r.imgH;

    // Иконка персонажа (10×10, кончик внизу по центру)
    const pw = 10 * s, ph = 10 * s;
    ctx.drawImage(playerPointerImg, cx - pw / 2, cy - ph, pw, ph);

    // Подпись
    ctx.font = `${11 * s}px Inter, sans-serif`;
    ctx.fillStyle = '#ff6666';
    ctx.fillText(`${playerX}, ${playerY}`, cx + 7 * s, cy - 2 * s);
  }

  // Сундуки и города
  drawnLocations = [];
  const showChests = document.getElementById('chk-chests').checked;
  if (showChests && r.chests) {
    r.chests.forEach(ch => {
      const { px: lx, py: ly } = worldToPixel(ch.x, ch.y, r);
      const lcx = lx * s, lcy = ly * s;
      drawnLocations.push({ loc: ch, cx: lcx, cy: lcy });
      const sz = 4 * s;
      // Ореол
      ctx.fillStyle = (ch.color || '#d4a017') + '30';
      ctx.fillRect(lcx - sz - 2*s, lcy - sz - 2*s, (sz + 2*s)*2, (sz + 2*s)*2);
      // Квадрат-сундук
      ctx.fillStyle = ch.color || '#d4a017';
      ctx.fillRect(lcx - sz, lcy - sz, sz*2, sz*2);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 0.8;
      ctx.strokeRect(lcx - sz, lcy - sz, sz*2, sz*2);
    });
  }

  // Города
  const showCities = document.getElementById('chk-cities').checked;
  if (showCities && r.locations) {
    r.locations.forEach(loc => {
      const { px: lx, py: ly } = worldToPixel(loc.x, loc.y, r);
      const lcx = lx * s, lcy = ly * s;
      drawnLocations.push({ loc, cx: lcx, cy: lcy });

      // Внешнее кольцо-ореол
      ctx.beginPath();
      ctx.arc(lcx, lcy, 5 * s, 0, Math.PI * 2);
      ctx.fillStyle = (loc.color || '#f0a040') + '28';
      ctx.fill();

      // Точка
      ctx.beginPath();
      ctx.arc(lcx, lcy, 3 * s, 0, Math.PI * 2);
      ctx.fillStyle = loc.color || '#f0a040';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });
  }

  // Инфо
  document.getElementById('coord-status').textContent =
    !playerSearched ? '' : inBounds ? '→ найден на карте' : '⚠ вне границ карты';
  document.getElementById('info-coords').textContent =
    playerSearched ? `Персонаж: ${playerX}, ${playerY}` : 'Персонаж: —';
}

// ── Кнопка Найти ─────────────────────────────────────────────────────────────
function findPlayer() {
  const xVal = document.getElementById('inp-x').value.trim();
  const yVal = document.getElementById('inp-y').value.trim();
  if (xVal === '' || yVal === '') return;
  playerX = parseFloat(xVal) || 0;
  playerY = parseFloat(yVal) || 0;
  playerSearched = true;
  drawMap();
}

// ── Зум ──────────────────────────────────────────────────────────────────────
function zoom(factor) {
  scale = Math.max(0.5, Math.min(4, scale * factor));
  drawMap();
}
function resetZoom() {
  scale = 1;
  drawMap();
}

// ── Enter ─────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') findPlayer();
});

// ── Hover тултип ─────────────────────────────────────────────────────────────
(function() {
  const tooltip = document.getElementById('loc-tooltip');

  const wrap = document.getElementById('map-wrap');

  wrap.addEventListener('mousemove', e => {
    if (!drawnLocations.length) return;

    const canvas = document.getElementById('map-canvas');
    const rect = wrap.getBoundingClientRect();
    // Пересчёт из CSS-пикселей в canvas-пиксели
    const mx = (e.clientX - rect.left) * (canvas.width  / rect.width);
    const my = (e.clientY - rect.top)  * (canvas.height / rect.height);

    const HIT = 8 * scale;
    let found = null;
    for (const { loc, cx, cy } of drawnLocations) {
      if (Math.hypot(mx - cx, my - cy) < HIT) { found = loc; break; }
    }

    // Координаты под курсором
    const r = REGIONS[currentRegion];
    if (r) {
      const coords = pixelToWorld(mx / scale, my / scale, r);
      if (coords) {
        document.getElementById('info-hover').textContent =
          `Курсор: ${coords.gx}, ${coords.gy}`;
      }
    }

    if (found) {
      tooltip.innerHTML = `${found.name} <span style="color:var(--txt3);font-size:11px">${found.x}, ${found.y}</span>`;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 10) + 'px';
    } else {
      tooltip.style.display = 'none';
    }
  });

  wrap.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none';
    document.getElementById('info-hover').textContent = '';
  });
})();

// ── Init ─────────────────────────────────────────────────────────────────────
selectRegion('floring');
</script>
