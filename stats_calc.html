<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор характеристик — Королевство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:      #d4a843;
  --gold-l:    #f5d878;
  --gold-d:    #a07d2b;
  --gold-tint: 212,168,67;
  --bg:        #0b0907;
  --bg2:       #120e09;
  --bg3:       #1a160f;
  --bg4:       #211810;
  --line:      rgba(212,168,67,.09);
  --line2:     rgba(212,168,67,.18);
  --txt:       #ece4cf;
  --txt2:      #a99775;
  --txt3:      #6c5d44;
  --serif:     'Fraunces', Georgia, serif;
  --sans:      'Inter', system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.top{
  height:52px;padding:0 28px;
  border-bottom:1px solid var(--line);
  background:rgba(11,9,7,.9);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:16px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:24px;height:24px;filter:drop-shadow(0 0 8px rgba(212,168,67,.4))}
.logo-n{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-.01em}
.nav{margin-left:16px;display:flex;gap:2px}
.nav a{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--txt2);font-weight:500;transition:background .12s,color .12s}
.nav a:hover{color:var(--txt);background:var(--bg2)}
.nav a.on{color:var(--gold-l);background:var(--bg3)}
.h-back{margin-left:auto;font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:5px;transition:color .15s}
.h-back:hover{color:var(--gold-l)}
.h-back::before{content:'←'}

/* ── PAGE ── */
.page{padding:28px 32px 80px;max-width:1320px;margin:0 auto}
.page-head{margin-bottom:20px}
.page-title{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}

.calc-layout{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;
}

/* ── CHARACTER BLOCK ── */
.char-block{
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;
}
.char-block-head{
  display:flex;align-items:center;
  padding:12px 18px 10px;border-bottom:1px solid var(--line);
}
.char-block-label{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--txt3)}
.char-block-inner{padding:14px 16px;display:flex;flex-direction:column;gap:12px}

/* ── CONTROLS ROW ── */
.char-controls{display:flex;align-items:center;gap:10px}

.nickname-input{
  width:130px;flex-shrink:0;
  padding:6px 10px;
  background:var(--bg3);border:1px solid var(--line);border-radius:7px;
  font-size:12px;font-family:var(--sans);color:var(--txt);outline:none;
  transition:border-color .15s;
}
.nickname-input::placeholder{color:var(--txt3)}
.nickname-input:focus{border-color:var(--line2)}

.cls-label{font-size:12px;color:var(--txt3);flex-shrink:0}

/* Class dropdown */
.cls-drop{position:relative}
.cls-dd-trigger{
  display:flex;align-items:center;gap:7px;
  padding:6px 10px;
  background:var(--bg3);border:1px solid var(--line2);border-radius:7px;
  cursor:pointer;font-size:12px;color:var(--txt2);font-weight:500;
  transition:background .12s,color .12s;user-select:none;white-space:nowrap;
}
.cls-dd-trigger:hover,.cls-drop.open .cls-dd-trigger{background:var(--bg4);color:var(--txt)}
.cls-drop.open .cls-dd-trigger{color:var(--gold-l);border-color:rgba(var(--gold-tint),.3)}
.cls-dd-ico{width:18px;height:18px;border-radius:3px;flex-shrink:0;object-fit:cover}
.cls-dd-arrow{width:10px;height:10px;opacity:.6;transition:transform .15s;flex-shrink:0}
.cls-drop.open .cls-dd-arrow{transform:rotate(180deg)}
.cls-dd-menu{
  display:none;position:absolute;top:calc(100% + 6px);left:0;
  background:var(--bg3);border:1px solid var(--line2);border-radius:9px;
  padding:5px;min-width:160px;z-index:200;
  box-shadow:0 12px 32px rgba(0,0,0,.6);
}
.cls-drop.open .cls-dd-menu{display:block}
.cls-dd-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:6px;
  font-size:12px;color:var(--txt2);font-weight:500;cursor:pointer;
  transition:background .1s,color .1s;
}
.cls-dd-item:hover{background:var(--bg4);color:var(--txt)}
.cls-dd-item.on{color:var(--gold-l)}
.cls-dd-item img{width:18px;height:18px;border-radius:3px;object-fit:cover;flex-shrink:0}

/* ── PAPERDOLL SECTION (unified grid: 7×34 + 6×6 = 274px) ── */
.paperdoll-section{
  display:flex;flex-direction:column;gap:6px;
  width:274px;margin:0 auto;
}
.paperdoll-middle{
  display:flex;gap:6px;align-items:stretch;
}

/* ── VERTICAL SLOT COLUMNS ── */
.slot-col-vert{display:flex;flex-direction:column;gap:6px;flex-shrink:0}

.slot-sq{
  width:34px;height:34px;
  background:var(--bg3);border:1px solid var(--line);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  cursor:pointer;
  transition:border-color .15s,background .15s;
  flex-shrink:0;
}
.slot-sq:hover{border-color:var(--line2);background:var(--bg4)}
.slot-sq.active{border-color:var(--gold)}
.slot-sq.equipped{border-color:var(--line2)}
.slot-sq img.item-img{width:32px;height:32px;object-fit:none}
.slot-sq img.frame-img{position:absolute;inset:4px;width:32px;height:32px;pointer-events:none}
.slot-sq .ico-empty{opacity:.15}

/* ── CHARACTER FIGURE — portrait, flex:1 → 184px in 260px container ── */
.char-figure-wrap{
  flex:1;min-width:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;min-height:260px;
}
.char-figure{max-width:100%;max-height:320px;object-fit:contain;display:block}
.char-figure-empty{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--txt3)}

/* ── BOTTOM SLOT ROWS — square, no labels ── */
.slot-row{display:grid;grid-template-columns:repeat(7,34px);gap:6px}

.slot-sq-cell{
  width:34px;height:34px;flex-shrink:0;
  background:var(--bg3);border:1px solid var(--line);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  cursor:pointer;
  transition:border-color .15s,background .15s;
}
.slot-sq-cell:hover{border-color:var(--line2);background:var(--bg4)}
.slot-sq-cell.active{border-color:var(--gold)}
.slot-sq-cell.equipped{border-color:var(--line2)}
.slot-sq-cell img.item-img{width:32px;height:32px;object-fit:none;max-width:80%;max-height:80%}
.slot-sq-cell img.frame-img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;object-fit:cover}
.slot-sq-cell .ico-empty{opacity:.15}

/* ── QUALITY PICKER ── */
.picker-panel{
  display:none;
  background:var(--bg3);border:1px solid var(--line2);border-radius:10px;
  padding:12px 14px;animation:fadeIn .13s ease;
}
.picker-panel.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.picker-btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.picker-item{
  position:relative;width:34px;height:34px;flex-shrink:0;
  border:1px solid var(--line);border-radius:4px;cursor:pointer;overflow:hidden;
  transition:border-color .12s;
}
.picker-item:hover{border-color:var(--line2);background:var(--bg4)}
.picker-item.on{border-color:var(--gold)}
.picker-unequip{
  padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;font-family:var(--sans);
  background:transparent;border:1px dashed var(--line2);color:var(--txt3);
  transition:color .12s,border-color .12s;
}
.picker-unequip:hover{color:var(--txt2);border-color:rgba(212,168,67,.3)}

/* ── BUFFS ── */
.buffs-title{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:8px}
.buffs-list{display:flex;flex-wrap:wrap;gap:5px}
.buff-toggle{
  display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--line);
  font-size:11px;color:var(--txt2);font-weight:500;
  transition:border-color .12s,color .12s,background .12s;user-select:none;
}
.buff-toggle:hover{border-color:var(--line2);color:var(--txt)}
.buff-toggle.on{border-color:rgba(212,168,67,.35);color:var(--gold-l);background:rgba(212,168,67,.06)}
.buff-check{
  width:12px;height:12px;border-radius:3px;border:1px solid var(--line2);background:var(--bg4);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;
}
.buff-toggle.on .buff-check{background:rgba(212,168,67,.15);border-color:var(--gold);color:var(--gold-l)}
.buff-cls-badge{font-size:10px;color:var(--txt3);font-weight:400}

/* ── STATS PANEL ── */
.stats-panel{background:var(--bg3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats-header{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.stats-title{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--txt)}
.stats-hint{font-size:11px;color:var(--txt3);font-style:italic}
.stat-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 14px;border-bottom:1px solid rgba(212,168,67,.04);transition:background .1s;
}
.stat-row:last-child{border-bottom:none}
.stat-row:hover{background:rgba(212,168,67,.02)}
.stat-key{font-size:12px;color:var(--txt2)}
.stat-val{font-family:var(--serif);font-size:13px;color:var(--gold-l);font-feature-settings:'tnum';font-weight:500}
.stat-empty{color:var(--txt3);font-size:12px;font-style:italic;padding:18px 14px;text-align:center}
.stat-buff-tag{font-size:10px;color:var(--gold);margin-left:4px;font-family:var(--sans)}

/* ── TOOLTIP ── */
#tt{
  position:fixed;z-index:1000;display:none;pointer-events:none;
  background:var(--bg3);border:1px solid var(--line2);border-radius:9px;
  padding:10px 13px;min-width:150px;max-width:220px;
  box-shadow:0 10px 28px rgba(0,0,0,.6);
}
.tt-name{font-family:var(--serif);font-size:13px;font-weight:500;color:var(--txt);margin-bottom:2px}
.tt-quality{font-size:11px;margin-bottom:6px}
.tt-stat{display:flex;justify-content:space-between;gap:12px;font-size:11px;padding:2px 0}
.tt-stat-k{color:var(--txt3)}
.tt-stat-v{color:var(--gold-l);font-feature-settings:'tnum'}
.tt-empty{font-size:11px;color:var(--txt3);font-style:italic}

/* ── PLACEHOLDER ── */
.char-block-placeholder{
  display:flex;align-items:center;justify-content:center;min-height:460px;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--txt3);
}

/* ── MOBILE ── */
@media(max-width:1000px){.calc-layout{grid-template-columns:1fr}}
@media(max-width:600px){.page{padding:20px 16px 60px}.top{padding:0 14px}.nav{display:none}}
</style>
</head>
<body>

<div id="tt"></div>

<header class="top">
  <a class="logo" href="index_new.html">
    <img src="kor_logo.svg" alt="">
    <div class="logo-n">Korolevstvo</div>
  </a>
  <nav class="nav">
    <a href="index_new.html">Главная</a>
    <a href="items_base.html">База предметов</a>
    <a class="on" href="stats_calc.html">Характеристики</a>
  </nav>
  <a class="h-back" href="index_new.html">На главную</a>
</header>

<div class="page">
  <div class="page-head">
    <div class="page-title">Калькулятор характеристик</div>
    <div class="page-sub">Сравнение двух персонажей</div>
  </div>

  <div class="calc-layout">

    <!-- ── ПЕРСОНАЖ 1 ── -->
    <div class="char-block" id="cb-c1">
      <div class="char-block-head">
        <span class="char-block-label">Персонаж 1</span>
      </div>
      <div class="char-block-inner">

        <!-- Никнейм + класс -->
        <div class="char-controls">
          <input class="nickname-input" type="text" id="nickname-c1" placeholder="Никнейм">
          <span class="cls-label">Класс:</span>
          <div class="cls-drop" id="clsDrop-c1">
            <div class="cls-dd-trigger" onclick="toggleClsDrop('c1')">
              <img class="cls-dd-ico" id="clsDdIco-c1" src="" alt="" onerror="this.style.display='none'">
              <span id="clsDdLabel-c1">Паладин</span>
              <svg class="cls-dd-arrow" viewBox="0 0 10 10" fill="none">
                <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="cls-dd-menu" id="clsDdMenu-c1"></div>
          </div>
        </div>

        <!-- Папердолл (260px: 7×32 + 6×6) -->
        <div class="paperdoll-section">
          <div class="paperdoll-middle">
            <div class="slot-col-vert" id="colLeft-c1"></div>
            <div class="char-figure-wrap" id="charFigureWrap-c1">
              <img class="char-figure" id="charFigure-c1" src="" alt=""
                onerror="this.style.display='none';document.getElementById('charFigureEmpty-c1').style.display='block'">
              <div class="char-figure-empty" id="charFigureEmpty-c1">персонаж</div>
            </div>
            <div class="slot-col-vert" id="colRight-c1"></div>
          </div>
          <div class="slot-row" id="slotRowTop-c1"></div>
          <div class="slot-row" id="slotRowBot-c1"></div>
        </div>

        <!-- Пикер -->
        <div class="picker-panel" id="pickerPanel-c1">
          <div class="picker-btns"  id="pickerBtns-c1"></div>
          <button class="picker-unequip" onclick="unequipActiveSlot('c1')">— Снять</button>
        </div>

        <!-- Баффы -->
        <div>
          <div class="buffs-title">Баффы группы</div>
          <div class="buffs-list" id="buffsList-c1"></div>
        </div>

        <!-- Статы -->
        <div class="stats-panel">
          <div class="stats-header">
            <div class="stats-title">Характеристики</div>
            <div class="stats-hint" id="statsHint-c1">выберите предметы</div>
          </div>
          <div class="stats-body" id="statsBody-c1"></div>
        </div>

      </div>
    </div>

    <!-- ── ПЕРСОНАЖ 2 ── -->
    <div class="char-block">
      <div class="char-block-head">
        <span class="char-block-label">Персонаж 2</span>
      </div>
      <div class="char-block-placeholder">скоро</div>
    </div>

  </div>
</div>

<script src="data.js"></script>
<script>
// ── DATA (constants from data.js: QUALITIES, QUALITY_ORDER, QUALITY_LEVEL, QUALITY_FRAME,
//          CLASS_NAMES, CLASS_ICON_FILE, CLASS_SET_NAMES, CLASS_SLOTS, CLASS_ITEM_NAMES,
//          getClassSetPath, getItemImg, STAT_LABELS, STATS, ARTIFACTS) ──────────

// Сверху вниз (пользователь описывал снизу вверх)
const COL_LEFT = [
  { id:'helm',      name:'Шлем' },
  { id:'shoulders', name:'Наплечники' },
  { id:'chest',     name:'Нагрудник' },
  { id:'belt',      name:'Пояс' },
  { id:'pants',     name:'Штаны' },
  { id:'boots',     name:'Сапоги' },
  { id:'trophy',    name:'Трофей' },
];
const COL_RIGHT = [
  { id:'amulet',    name:'Амулет' },
  { id:'bracelet',  name:'Браслет' },
  { id:'talisman',  name:'Талисман' },
  { id:'gloves',    name:'Перчатки' },
  { id:'ring1',     name:'Кольцо' },
  { id:'ring2',     name:'Кольцо' },
  { id:'badge',     name:'Жетон' },
];
const ROW_TOP = [
  { id:'stone_greed',  name:'Камень Алчности' },
  { id:'flask',        name:'Фляжка' },
  { id:'weapon',       name:'Оружие' },
  { id:'battle_bag',   name:'Боевая сумка' },
  { id:'offhand',      name:'Второе оружие' },
  { id:'trinket',      name:'Брелок' },
  { id:'stone_blood',  name:'Камень Крови' },
];
const ROW_BOT = [
  { id:'stone_travel',  name:'Камень Путешествий' },
  { id:'stone_contest', name:'Камень Состязаний' },
  { id:'stone_friend',  name:'Камень Дружбы' },
  { id:'stone_witch',   name:'Камень Ведьмака' },
  { id:'stone_labor',   name:'Камень Труда' },
  { id:'stone_lost',    name:'Камень Потерянных Земель' },
  { id:'stone_luck',    name:'Камень Удачи' },
];

const ALL_SLOTS = [...COL_LEFT, ...COL_RIGHT, ...ROW_TOP, ...ROW_BOT];


const CLASS_BUFFS = [
  { name:'Зоркий глаз',   cls:'archer',  effect:'atk_eff',       value:15 },
  { name:'Ураган',        cls:'mage',    effect:'atk_eff',       value:15 },
  { name:'Благословение', cls:'monk',    effect:'hp',            value:8, pct:true },
  { name:'Святое слово',  cls:'paladin', effect:'hp',            value:8, pct:true },
  { name:'Пылающий щит',  cls:'warrior', effect:'dmg_taken_red', value:8 },
  { name:'Дар теней',     cls:'rogue',   effect:'dmg_taken_red', value:8 },
];

// ── STATE ─────────────────────────────────────────────────────────────────────

const state = {
  c1: { cls:'paladin', activeSlot:null, equipped:{}, buffs:new Set() },
  c2: { cls:'paladin', activeSlot:null, equipped:{}, buffs:new Set() },
};

// ── TOOLTIP ───────────────────────────────────────────────────────────────────

const ttEl = document.getElementById('tt');

function showTt(e, cid, slot) {
  const s   = state[cid];
  const eq  = s.equipped[slot.id];
  const q   = eq ? QUALITIES.find(q => q.id === eq.quality) : null;

  let html = `<div class="tt-name">${slot.name}</div>`;
  if (eq && q) {
    html += `<div class="tt-quality" style="color:${q.color}">${q.label}</div>`;
    if (eq.stats) {
      Object.entries(eq.stats).forEach(([k, v]) => {
        const meta = STAT_LABELS.find(m => m.key === k);
        if (!meta) return;
        const vStr = meta.pct ? `+${Number(v).toFixed(2).replace(/\.00$/,'')}%` : (Number.isInteger(v) ? String(v) : Number(v).toFixed(2));
        html += `<div class="tt-stat"><span class="tt-stat-k">${meta.label}</span><span class="tt-stat-v">${vStr}</span></div>`;
      });
    } else {
      html += `<div class="tt-empty">нет данных</div>`;
    }
  } else {
    html += `<div class="tt-empty">пусто</div>`;
  }

  ttEl.innerHTML = html;
  ttEl.style.display = 'block';
  moveTt(e);
}

function moveTt(e) {
  const margin = 14;
  let x = e.clientX + margin;
  let y = e.clientY + margin;
  if (x + 230 > window.innerWidth)  x = e.clientX - 230;
  if (y + ttEl.offsetHeight + 10 > window.innerHeight) y = e.clientY - ttEl.offsetHeight - margin;
  ttEl.style.left = x + 'px';
  ttEl.style.top  = y + 'px';
}

function hideTt() { ttEl.style.display = 'none'; }

// ── HELPERS ───────────────────────────────────────────────────────────────────

function getStatsForSlot(cls, slotId, quality) {
  return STATS[cls]?.[quality]?.[slotId] || null;
}

// Placeholder SVGs for empty slots
const PH = {
  sword:    `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 16L14 6M11 3l3 3M6 14l-2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="6" r="2" stroke="currentColor" stroke-width="1.2"/></svg>`,
  shield:   `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L3 5.5v5c0 3.5 3 6 7 7 4-1 7-3.5 7-7v-5L10 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  helmet:   `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 11c0-2.8 2.2-6 5-6s5 3.2 5 6M3 11h14M6 15h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  chest:    `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7h12v9a2 2 0 01-2 2H6a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 7V5a2 2 0 014 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  shoulders:`<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 12c0-3 1.5-5 4-5s4 2 4 5M10 12c0-3 1.5-5 4-5s4 2 4 5M2 12h16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  pants:    `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4h12v4l-2 10H9l-1-6-1 6H5L3 8V4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  belt:     `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="8" width="16" height="4" rx="2" stroke="currentColor" stroke-width="1.4"/><rect x="8" y="9.2" width="4" height="1.6" rx="0.5" stroke="currentColor" stroke-width="1.2"/></svg>`,
  boots:    `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 3v9l-3 3h9l1-3V3H7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  gloves:   `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 14V9.5a1 1 0 012 0V8a1 1 0 012 0V7a1 1 0 012 0v2.5a1 1 0 002 0V9a1 1 0 012 0V14c0 1.7-1.3 3-3 3H9a3 3 0 01-3-3z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  ring:     `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.1"/></svg>`,
  amulet:   `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2l2.5 5.5H18l-4.5 3.5 1.5 5.5L10 14l-5 2.5 1.5-5.5L2 7.5h5.5L10 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
  gem:      `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L17 8L10 18L3 8L10 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M3 8h14M10 2L6 8l4 10M10 2l4 6-4 10" stroke="currentColor" stroke-width="1" opacity=".5"/></svg>`,
  flask:    `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 3h4M7.5 3v6L4 15a1 1 0 001 1h10a1 1 0 001-1l-3.5-6V3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  bag:      `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="8" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 8V6a3 3 0 016 0v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  trophy:   `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 17h6M10 14v3M6 3h8l-1 7a3 3 0 01-6 0L6 3z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 5H3l1 5M14 5h3l-1 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  badge:    `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2l1.5 5H17l-4.5 3 1.5 5L10 12.5 6 15l1.5-5L3 7h5.5L10 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
  key:      `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l5 5M14 13l-2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  bracelet: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6" stroke="currentColor" stroke-width="2.5"/></svg>`,
};

const SLOT_PH = {
  trophy:'trophy', badge:'badge', ring1:'ring', ring2:'ring',
  talisman:'amulet', bracelet:'bracelet', amulet:'amulet',
  flask:'flask', battle_bag:'bag', trinket:'key',
};

// Derived from ARTIFACTS (data.js): slot → list of items; slot → placeholder image
const SLOT_ITEMS = {};
const ARTEFACT_PH = {};
ARTIFACTS.forEach(a => {
  if (!a.slotId) return;
  if (!SLOT_ITEMS[a.slotId]) SLOT_ITEMS[a.slotId] = [];
  SLOT_ITEMS[a.slotId].push(a);
  if (!ARTEFACT_PH[a.slotId]) ARTEFACT_PH[a.slotId] = a.img;
});

function icoHtml(slotId, eq, cls) {
  if (!eq) {
    // Use class-specific white set as grayscale placeholder for armor/weapon slots
    const phSrc = getItemImg(cls, slotId, 'white') || ARTEFACT_PH[slotId];
    if (phSrc) {
      return `<img src="${phSrc}" alt=""
        style="width:32px;height:32px;object-fit:none;filter:grayscale(1);opacity:.28"
        onerror="this.style.display='none'">`;
    }
    const ph = PH[SLOT_PH[slotId]] || PH.bag;
    return `<span style="opacity:.22;color:var(--txt2);display:flex;align-items:center;justify-content:center">${ph}</span>`;
  }
  const imgSrc   = eq.img || getItemImg(cls, slotId, eq.quality);
  const frameSrc = QUALITY_FRAME[eq.quality];
  const qColor   = QUALITIES.find(q => q.id === eq.quality)?.color;
  // Frame goes BEHIND item icon (background), icon goes on top at full 32x32
  return `${frameSrc ? `<img class="frame-img" src="${frameSrc}" alt="" style="position:absolute;inset:0;width:32px;height:32px;pointer-events:none;z-index:0" onerror="this.style.display='none'">` : ''}
          ${imgSrc   ? `<img src="${imgSrc}" alt="" style="position:absolute;inset:0;width:32px;height:32px;object-fit:none;z-index:1" onerror="this.style.display='none'">` : ''}
          ${!imgSrc && qColor ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1"><div style="width:10px;height:10px;border-radius:50%;background:${qColor}"></div></div>` : ''}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function renderClsDrop(cid) {
  const s = state[cid];
  const ico = document.getElementById(`clsDdIco-${cid}`);
  ico.src = `stats_calculator/classes/${CLASS_ICON_FILE[s.cls]}`;
  ico.style.display = '';
  document.getElementById(`clsDdLabel-${cid}`).textContent = CLASS_NAMES[s.cls];
  document.getElementById(`clsDdMenu-${cid}`).innerHTML = Object.keys(CLASS_NAMES).map(cls =>
    `<div class="cls-dd-item${cls === s.cls ? ' on' : ''}" onclick="selectClass('${cid}','${cls}')">
      <img src="stats_calculator/classes/${CLASS_ICON_FILE[cls]}" alt="" onerror="this.style.display='none'">
      ${CLASS_NAMES[cls]}
    </div>`
  ).join('');
}

function renderSlotCol(cid, slots, containerId) {
  const s = state[cid];
  document.getElementById(containerId).innerHTML = slots.map(slot => {
    const eq = s.equipped[slot.id];
    const isActive = s.activeSlot === slot.id;
    const cls = ['slot-sq', isActive ? 'active' : '', eq ? 'equipped' : ''].filter(Boolean).join(' ');
    return `<div class="${cls}"
      onclick="openPicker('${cid}','${slot.id}')"
      onmouseenter="showTt(event,'${cid}',${JSON.stringify(slot).replace(/"/g,'&quot;')})"
      onmousemove="moveTt(event)"
      onmouseleave="hideTt()">${icoHtml(slot.id, eq, s.cls)}</div>`;
  }).join('');
}

function renderSlotRow(cid, rowSlots, containerId) {
  const s = state[cid];
  document.getElementById(containerId).innerHTML = rowSlots.map(slot => {
    const eq = s.equipped[slot.id];
    const isActive = s.activeSlot === slot.id;
    const cls = ['slot-sq-cell', isActive ? 'active' : '', eq ? 'equipped' : ''].filter(Boolean).join(' ');
    return `<div class="${cls}"
      onclick="openPicker('${cid}','${slot.id}')"
      onmouseenter="showTt(event,'${cid}',${JSON.stringify(slot).replace(/"/g,'&quot;')})"
      onmousemove="moveTt(event)"
      onmouseleave="hideTt()">${icoHtml(slot.id, eq, s.cls)}</div>`;
  }).join('');
}

let _pickerCache = {};

function getPickerItems(cls, slotId) {
  if (SLOT_ITEMS[slotId]) return SLOT_ITEMS[slotId];
  // Armor/weapon: one item per quality that has image or stats
  const slotName = [...COL_LEFT, ...COL_RIGHT, ...ROW_TOP, ...ROW_BOT].find(s => s.id === slotId)?.name || slotId;
  const setNames = CLASS_SET_NAMES[cls] || {};
  return QUALITIES
    .filter(q => getItemImg(cls, slotId, q.id) || getStatsForSlot(cls, slotId, q.id))
    .map(q => ({
      name:  [slotName, setNames[q.id]].filter(Boolean).join(' '),
      quality: q.id,
      img:   getItemImg(cls, slotId, q.id),
      stats: getStatsForSlot(cls, slotId, q.id),
    }));
}

function renderPicker(cid) {
  const s = state[cid];
  const panel = document.getElementById(`pickerPanel-${cid}`);
  const btns  = document.getElementById(`pickerBtns-${cid}`);
  if (!s.activeSlot) { panel.classList.remove('open'); return; }

  const items = getPickerItems(s.cls, s.activeSlot);
  _pickerCache[cid] = items;
  const eqItem = s.equipped[s.activeSlot];

  btns.innerHTML = items.map((item, idx) => {
    const frameSrc = QUALITY_FRAME[item.quality] || '';
    const isOn = eqItem && eqItem.name === item.name && eqItem.quality === item.quality;
    return `<div class="picker-item${isOn ? ' on' : ''}"
      onclick="equipItem('${cid}','${s.activeSlot}',${idx})"
      onmouseenter="showPickerTt(event,'${cid}',${idx})"
      onmousemove="moveTt(event)"
      onmouseleave="hideTt()">
      ${frameSrc ? `<img src="${frameSrc}" style="position:absolute;inset:0;width:32px;height:32px;pointer-events:none;z-index:0" onerror="this.style.display='none'">` : ''}
      ${item.img ? `<img src="${item.img}" style="position:absolute;inset:0;width:32px;height:32px;object-fit:none;z-index:1" onerror="this.style.display='none'">` : ''}
    </div>`;
  }).join('');

  panel.classList.add('open');
}

function showPickerTt(e, cid, idx) {
  const item = (_pickerCache[cid] || [])[idx];
  if (!item) return;
  const q = QUALITIES.find(q => q.id === item.quality);
  let html = `<div class="tt-name">${item.name}</div>`;
  if (q) html += `<div class="tt-quality" style="color:${q.color}">${q.label}</div>`;
  if (item.stats) {
    Object.entries(item.stats).forEach(([k, v]) => {
      const meta = STAT_LABELS.find(m => m.key === k);
      if (meta) html += `<div class="tt-stat"><span class="tt-sk">${meta.label}</span><span class="tt-sv">+${meta.pct ? v+'%' : v}</span></div>`;
    });
  }
  ttEl.innerHTML = html;
  ttEl.style.display = 'block';
  moveTt(e);
}

function equipItem(cid, slotId, idx) {
  const s = state[cid];
  const item = (_pickerCache[cid] || [])[idx];
  if (!item) return;
  s.equipped[slotId] = { name: item.name, quality: item.quality, img: item.img, stats: item.stats };
  s.activeSlot = null;
  renderAll(cid);
}

function renderBuffs(cid) {
  const s = state[cid];
  document.getElementById(`buffsList-${cid}`).innerHTML = CLASS_BUFFS.map((b, i) =>
    `<div class="buff-toggle${s.buffs.has(i) ? ' on' : ''}" onclick="toggleBuff('${cid}',${i})">
      <div class="buff-check">${s.buffs.has(i) ? '✓' : ''}</div>
      ${b.name} <span class="buff-cls-badge">(${CLASS_NAMES[b.cls]})</span>
    </div>`
  ).join('');
}

function renderStats(cid) {
  const s    = state[cid];
  const body = document.getElementById(`statsBody-${cid}`);
  const hint = document.getElementById(`statsHint-${cid}`);
  const totals = {};
  let hasAny = false;
  Object.values(s.equipped).forEach(eq => {
    if (!eq?.stats) return;
    hasAny = true;
    Object.entries(eq.stats).forEach(([k,v]) => { totals[k] = (totals[k]||0)+v; });
  });
  if (!hasAny) {
    hint.textContent = 'выберите предметы';
    body.innerHTML = `<div class="stat-empty">Выберите предметы, чтобы увидеть характеристики</div>`;
    return;
  }
  const cnt = Object.keys(s.equipped).length;
  hint.textContent = `${cnt} ${cnt===1?'предмет':cnt<5?'предмета':'предметов'}`;
  const buffEffects = {};
  s.buffs.forEach(i => {
    const b = CLASS_BUFFS[i];
    if (!b || b.effect==='dmg_taken_red') return;
    const bonus = b.pct ? (totals[b.effect]||0)*b.value/100 : b.value;
    buffEffects[b.effect] = (buffEffects[b.effect]||0)+bonus;
  });
  const dmgRed = CLASS_BUFFS.filter((b,i)=>b.effect==='dmg_taken_red'&&s.buffs.has(i)).reduce((s,b)=>s+b.value,0);
  let html = '';
  STAT_LABELS.forEach(meta => {
    const total = (totals[meta.key]||0)+(buffEffects[meta.key]||0);
    if (total===0) return;
    const valStr = meta.pct ? `+${total.toFixed(2).replace(/\.00$/,'')}%` : (Number.isInteger(total)?String(total):total.toFixed(2));
    const bonus = buffEffects[meta.key]||0;
    const buffTag = bonus>0 ? `<span class="stat-buff-tag">+${meta.pct?bonus.toFixed(1)+'%':Math.round(bonus)} бафф</span>` : '';
    html += `<div class="stat-row"><span class="stat-key">${meta.label}</span><span class="stat-val">${valStr}${buffTag}</span></div>`;
  });
  if (dmgRed>0) html += `<div class="stat-row"><span class="stat-key">Снижение урона (бафф)</span><span class="stat-val">−${dmgRed}%</span></div>`;
  if (!html) html = `<div class="stat-empty">Нет данных для выбранных слотов</div>`;
  body.innerHTML = html;
}

function renderAll(cid) {
  renderClsDrop(cid);
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
  renderBuffs(cid);
  renderStats(cid);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────

function toggleClsDrop(cid) { document.getElementById(`clsDrop-${cid}`).classList.toggle('open'); }

function selectClass(cid, cls) {
  const s = state[cid];
  s.cls = cls; s.activeSlot = null;
  Object.keys(s.equipped).forEach(k => delete s.equipped[k]);
  document.getElementById(`clsDrop-${cid}`).classList.remove('open');
  renderAll(cid);
}

function openPicker(cid, slotId) {
  const s = state[cid];
  s.activeSlot = s.activeSlot===slotId ? null : slotId;
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
}

function equipSlot(cid, slotId, quality) {
  const s = state[cid];
  s.equipped[slotId] = { quality, stats: getStatsForSlot(s.cls, slotId, quality) };
  s.activeSlot = null;
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
  renderStats(cid);
}

function unequipActiveSlot(cid) {
  const s = state[cid];
  if (!s.activeSlot) return;
  delete s.equipped[s.activeSlot];
  s.activeSlot = null;
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
  renderStats(cid);
}

function toggleBuff(cid, i) {
  const s = state[cid];
  if (s.buffs.has(i)) s.buffs.delete(i); else s.buffs.add(i);
  renderBuffs(cid);
  renderStats(cid);
}

document.addEventListener('click', e => {
  ['c1','c2'].forEach(cid => {
    const drop = document.getElementById(`clsDrop-${cid}`);
    if (drop && !drop.contains(e.target)) drop.classList.remove('open');
  });
});

// ── INIT ──────────────────────────────────────────────────────────────────────
renderAll('c1');
</script>
</body>
</html>
