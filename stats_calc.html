<title>Калькулятор характеристик — Королевство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:      #d4a843;
  --gold-l:    #f5d878;
  --gold-d:    #a07d2b;
  --gold-tint: 212,168,67;
  --bg:        #0b0907;
  --bg2:       #120e09;
  --bg3:       #1a160f;
  --bg4:       #211810;
  --line:      rgba(212,168,67,.09);
  --line2:     rgba(212,168,67,.18);
  --txt:       #ece4cf;
  --txt2:      #a99775;
  --txt3:      #6c5d44;
  --serif:     'Fraunces', Georgia, serif;
  --sans:      'Inter', system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.top{
  height:52px;padding:0 28px;
  border-bottom:1px solid var(--line);
  background:rgba(11,9,7,.9);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:16px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:24px;height:24px;filter:drop-shadow(0 0 8px rgba(212,168,67,.4))}
.logo-n{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-.01em}
.nav{margin-left:16px;display:flex;gap:2px}
.nav a{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--txt2);font-weight:500;transition:background .12s,color .12s}
.nav a:hover{color:var(--txt);background:var(--bg2)}
.nav a.on{color:var(--gold-l);background:var(--bg3)}
.h-back{margin-left:auto;font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:5px;transition:color .15s}
.h-back:hover{color:var(--gold-l)}
.h-back::before{content:'←'}

/* ── PAGE LAYOUT ── */
.page{padding:28px 32px 80px;max-width:1320px;margin:0 auto}
.page-head{margin-bottom:20px}
.page-title{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}

.calc-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items:start;
}

/* ── CHARACTER BLOCK ── */
.char-block{
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;
  display:flex;flex-direction:column;gap:0;
}
.char-block-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 12px;
  border-bottom:1px solid var(--line);
}
.char-block-label{
  font-family:var(--serif);font-size:15px;font-weight:500;color:var(--txt2);letter-spacing:-.005em;
}
.char-block-inner{padding:16px 18px;display:flex;flex-direction:column;gap:16px}

/* ── PLACEHOLDER (char 2) ── */
.char-block-placeholder{
  display:flex;align-items:center;justify-content:center;
  min-height:420px;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--txt3);
}

/* ── CLASS TABS ── */
.cls-tabs{display:flex;gap:2px;flex-wrap:wrap}
.cls-tab{
  display:flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:7px;cursor:pointer;
  font-size:12px;color:var(--txt2);font-weight:500;
  transition:background .12s,color .12s;
  border:1px solid transparent;
}
.cls-tab:hover{background:var(--bg3);color:var(--txt)}
.cls-tab.on{background:var(--bg3);color:var(--gold-l);border-color:var(--line2)}
.cls-tab-ico{width:16px;height:16px;border-radius:2px;flex-shrink:0;object-fit:cover}

/* ── PAPERDOLL ── */
.paperdoll-wrap{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:0 10px;
  align-items:start;
}
.slot-col{display:flex;flex-direction:column;gap:6px}
.slot-col.right{align-items:flex-start}
.slot-col.left{align-items:flex-end}

.slot-btn{
  display:flex;align-items:center;gap:7px;
  padding:6px 8px;border-radius:8px;
  background:var(--bg3);border:1px solid var(--line);
  cursor:pointer;transition:border-color .15s,background .15s;
  width:100%;position:relative;
}
.slot-btn:hover{border-color:var(--line2);background:var(--bg4)}
.slot-btn.active{border-color:var(--gold);background:var(--bg4)}
.slot-btn.equipped{border-color:var(--line2)}

.slot-col.left .slot-btn{flex-direction:row-reverse}
.slot-col.left .slot-label{text-align:right}

.slot-ico-wrap{
  width:32px;height:32px;border-radius:5px;
  background:var(--bg4);border:1px solid var(--line);
  flex-shrink:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.slot-ico-wrap img.item-img{width:32px;height:32px;object-fit:none}
.slot-ico-wrap img.frame-img{position:absolute;inset:0;width:32px;height:32px;pointer-events:none}

.slot-label{flex:1;min-width:0}
.slot-name-txt{font-size:11px;color:var(--txt3);line-height:1.2}
.slot-item-txt{font-size:12px;color:var(--txt);line-height:1.3;overflow-wrap:break-word;word-break:break-word}

/* ── CHARACTER CENTER ── */
.char-center{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-top:2px;
}
.char-img-wrap{
  width:72px;height:72px;
  background:var(--bg3);border:1px solid var(--line2);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.char-img-wrap img{width:100%;height:100%;object-fit:contain}
.char-name{font-family:var(--serif);font-size:12px;color:var(--gold-l);font-weight:500;text-align:center}
.char-reset{
  font-size:10px;color:var(--txt3);cursor:pointer;
  padding:3px 8px;border-radius:4px;border:1px solid var(--line);
  transition:color .15s,border-color .15s;white-space:nowrap;
}
.char-reset:hover{color:var(--txt2);border-color:var(--line2)}

/* ── QUALITY PICKER ── */
.picker-panel{
  display:none;
  background:var(--bg3);border:1px solid var(--line2);border-radius:10px;
  padding:12px 14px;
  animation:fadeIn .13s ease;
}
.picker-panel.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.picker-title{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:8px}
.picker-btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.picker-btn{
  padding:5px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;
  background:var(--bg4);border:1px solid var(--line);
  transition:border-color .12s,background .12s;
}
.picker-btn:hover{border-color:var(--line2)}
.picker-btn.no-data{opacity:.3;cursor:default}
.picker-btn.equipped-q{outline:2px solid currentColor;outline-offset:1px}
.picker-unequip{
  padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;font-family:var(--sans);
  background:transparent;border:1px dashed var(--line2);color:var(--txt3);
  transition:color .12s,border-color .12s;
}
.picker-unequip:hover{color:var(--txt2);border-color:rgba(212,168,67,.3)}

/* ── BUFFS ── */
.buffs-section{}
.buffs-title{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:8px}
.buffs-list{display:flex;flex-wrap:wrap;gap:5px}
.buff-toggle{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:6px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--line);
  font-size:11px;color:var(--txt2);font-weight:500;
  transition:border-color .12s,color .12s,background .12s;
  user-select:none;
}
.buff-toggle:hover{border-color:var(--line2);color:var(--txt)}
.buff-toggle.on{border-color:rgba(212,168,67,.35);color:var(--gold-l);background:rgba(212,168,67,.06)}
.buff-check{
  width:12px;height:12px;border-radius:3px;
  border:1px solid var(--line2);background:var(--bg4);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:8px;
}
.buff-toggle.on .buff-check{background:rgba(212,168,67,.15);border-color:var(--gold);color:var(--gold-l)}
.buff-cls-badge{font-size:10px;color:var(--txt3);font-weight:400}

/* ── STATS PANEL ── */
.stats-panel{background:var(--bg3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats-header{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.stats-title{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--txt)}
.stats-hint{font-size:11px;color:var(--txt3);font-style:italic}
.stat-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 14px;
  border-bottom:1px solid rgba(212,168,67,.04);
  transition:background .1s;
}
.stat-row:last-child{border-bottom:none}
.stat-row:hover{background:rgba(212,168,67,.02)}
.stat-key{font-size:12px;color:var(--txt2)}
.stat-val{font-family:var(--serif);font-size:13px;color:var(--gold-l);font-feature-settings:'tnum';font-weight:500}
.stat-empty{color:var(--txt3);font-size:12px;font-style:italic;padding:18px 14px;text-align:center}
.stat-buff-tag{font-size:10px;color:var(--gold);margin-left:4px;font-family:var(--sans)}

/* ── MOBILE ── */
@media(max-width:960px){
  .calc-layout{grid-template-columns:1fr}
  .page{padding:20px 16px 60px}
}
@media(max-width:600px){
  .top{padding:0 14px}
  .nav{display:none}
}
</style>
</head>

    },
    purple_plus: {
      gloves:  { atk:16.30, def:4.78, hp:855, mana:170, heal_eff:5, fire_res:0.80, elem_def:124 },
    },
  },
};

// ── STATE ─────────────────────────────────────────────────────────────────────

const state = {
  c1: { cls:'paladin', activeSlot:null, equipped:{}, buffs:new Set() },
  c2: { cls:'paladin', activeSlot:null, equipped:{}, buffs:new Set() },
};

// ── HELPERS ───────────────────────────────────────────────────────────────────

function getItemImg(cls, slotId, quality) {
  const slotMap = CLASS_SLOTS_IMG[cls];
  if (!slotMap) return null;
  const slotFile = slotMap[slotId];
  if (!slotFile) return null;
  const lvl = QUALITY_LEVEL[quality];
  if (!lvl) return null;
  return `stats_calculator/classes/${cls}/${cls}_sets/${quality}_set/elf/${cls}_${slotFile}_${lvl}_elf.png`;
}

function getItemName(cls, slotId, quality) {
  const baseName = (CLASS_ITEM_NAMES[cls] || {})[slotId] || SLOTS.find(s => s.id === slotId)?.name || slotId;
  const setName  = (CLASS_SET_NAMES[cls] || {})[quality] || '';
  if (quality === 'purple_plus') {
    const усил = УСИЛ[baseName] || 'Усиленный';
    return `${усил} ${baseName}${setName ? ' ' + setName : ''}`;
  }
  return setName ? `${baseName} ${setName}` : baseName;
}

function getStatsForSlot(cls, slotId, quality) {
  return STATS[cls]?.[quality]?.[slotId] || null;
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function renderClassTabs(cid) {
  const s = state[cid];
  document.getElementById(`clsTabs-${cid}`).innerHTML =
    Object.keys(CLASS_NAMES).map(cls => {
      const on = cls === s.cls ? ' on' : '';
      return `<div class="cls-tab${on}" onclick="selectClass('${cid}','${cls}')">
        <img class="cls-tab-ico" src="stats_calculator/classes/${CLASS_ICON_FILE[cls]}" alt="" onerror="this.style.display='none'">
        ${CLASS_NAMES[cls]}
      </div>`;
    }).join('');
}

function renderCharCenter(cid) {
  const s = state[cid];
  document.getElementById(`charImg-${cid}`).src = `stats_calculator/classes/${CLASS_ICON_FILE[s.cls]}`;
  document.getElementById(`charName-${cid}`).textContent = CLASS_NAMES[s.cls];
}

function renderSlots(cid) {
  const s = state[cid];
  const left  = document.getElementById(`colLeft-${cid}`);
  const right = document.getElementById(`colRight-${cid}`);
  left.innerHTML = '';
  right.innerHTML = '';

  SLOTS.forEach(slot => {
    const eq = s.equipped[slot.id];
    const on  = s.activeSlot === slot.id ? ' active' : '';
    const eqCls = eq ? ' equipped' : '';
    const qColor = eq ? QUALITIES.find(q => q.id === eq.quality)?.color || '#888' : 'transparent';
    const imgSrc   = eq ? getItemImg(s.cls, slot.id, eq.quality) : null;
    const frameSrc = eq ? QUALITY_FRAME[eq.quality] : null;
    const itemName = eq ? getItemName(s.cls, slot.id, eq.quality) : '';

    const icoHtml = eq
      ? `${imgSrc   ? `<img class="item-img"  src="${imgSrc}"   alt="" onerror="this.style.display='none'">` : ''}
         ${frameSrc ? `<img class="frame-img" src="${frameSrc}" alt="" onerror="this.style.display='none'">` : ''}`
      : `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="opacity:.2"><rect x="1.5" y="1.5" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2"/></svg>`;

    const labelHtml = eq
      ? `<div class="slot-label">
           <div class="slot-name-txt">${slot.name}</div>
           <div class="slot-item-txt" style="color:${qColor}">${itemName}</div>
         </div>`
      : `<div class="slot-label"><div class="slot-name-txt">${slot.name}</div></div>`;

    const html = `<div class="slot-btn${on}${eqCls}" onclick="openPicker('${cid}','${slot.id}')">
      <div class="slot-ico-wrap">${icoHtml}</div>
      ${labelHtml}
    </div>`;

    if (slot.col === 'left') left.insertAdjacentHTML('beforeend', html);
    else                      right.insertAdjacentHTML('beforeend', html);
  });
}

function renderPicker(cid) {
  const s     = state[cid];
  const panel = document.getElementById(`pickerPanel-${cid}`);
  const title = document.getElementById(`pickerTitle-${cid}`);
  const btns  = document.getElementById(`pickerBtns-${cid}`);

  if (!s.activeSlot) { panel.classList.remove('open'); return; }

  const slot = SLOTS.find(sl => sl.id === s.activeSlot);
  title.textContent = slot?.name || s.activeSlot;

  btns.innerHTML = QUALITIES.map(q => {
    const hasStats  = !!getStatsForSlot(s.cls, s.activeSlot, q.id);
    const isEq      = s.equipped[s.activeSlot]?.quality === q.id;
    const noDataCls = hasStats ? '' : ' no-data';
    const eqCls     = isEq    ? ' equipped-q' : '';
    return `<button class="picker-btn${noDataCls}${eqCls}" style="color:${q.color}"
      onclick="equipSlot('${cid}','${s.activeSlot}','${q.id}')"${hasStats ? '' : ' disabled'}>${q.label}</button>`;
  }).join('');

  panel.classList.add('open');
}

function renderBuffs(cid) {
  const s = state[cid];
  document.getElementById(`buffsList-${cid}`).innerHTML =
    CLASS_BUFFS.map((b, i) => {
      const on = s.buffs.has(i) ? ' on' : '';
      return `<div class="buff-toggle${on}" onclick="toggleBuff('${cid}',${i})">
        <div class="buff-check">${s.buffs.has(i) ? '✓' : ''}</div>
        ${b.name}
        <span class="buff-cls-badge">(${CLASS_NAMES[b.cls] || b.cls})</span>
      </div>`;
    }).join('');
}

function renderStats(cid) {
  const s    = state[cid];
  const body = document.getElementById(`statsBody-${cid}`);
  const hint = document.getElementById(`statsHint-${cid}`);

  const totals = {};
  let hasAny = false;
  Object.values(s.equipped).forEach(eq => {
    if (!eq?.stats) return;
    hasAny = true;
    Object.entries(eq.stats).forEach(([k, v]) => { totals[k] = (totals[k] || 0) + v; });
  });

  if (!hasAny) {
    hint.textContent = 'наденьте экипировку';
    body.innerHTML = `<div class="stat-empty">Оденьте предметы, чтобы увидеть характеристики</div>`;
    return;
  }

  const cnt = Object.keys(s.equipped).length;
  hint.textContent = `${cnt} ${cnt === 1 ? 'предмет' : cnt < 5 ? 'предмета' : 'предметов'}`;

  // Buff bonuses
  const buffEffects = {};
  s.buffs.forEach(i => {
    const b = CLASS_BUFFS[i];
    if (!b || b.effect === 'dmg_taken_red') return;
    const bonus = b.pct ? (totals[b.effect] || 0) * b.value / 100 : b.value;
    buffEffects[b.effect] = (buffEffects[b.effect] || 0) + bonus;
  });

  const dmgRedTotal = CLASS_BUFFS
    .filter((b, i) => b.effect === 'dmg_taken_red' && s.buffs.has(i))
    .reduce((sum, b) => sum + b.value, 0);

  let html = '';
  STAT_LABELS.forEach(meta => {
    const base  = totals[meta.key] || 0;
    const bonus = buffEffects[meta.key] || 0;
    const total = base + bonus;
    if (total === 0) return;

    const valStr = meta.pct
      ? `+${total.toFixed(2).replace(/\.00$/, '')}%`
      : (Number.isInteger(total) ? String(total) : total.toFixed(2));

    const buffTag = bonus > 0
      ? `<span class="stat-buff-tag">+${meta.pct ? bonus.toFixed(1)+'%' : Math.round(bonus)} бафф</span>`
      : '';

    html += `<div class="stat-row">
      <span class="stat-key">${meta.label}</span>
      <span class="stat-val">${valStr}${buffTag}</span>
    </div>`;
  });

  if (dmgRedTotal > 0) {
    html += `<div class="stat-row">
      <span class="stat-key">Снижение урона (бафф)</span>
      <span class="stat-val">−${dmgRedTotal}%</span>
    </div>`;
  }

  if (!html) html = `<div class="stat-empty">Нет данных для выбранных слотов</div>`;
  body.innerHTML = html;
}

function render(cid) {
  renderClassTabs(cid);
  renderCharCenter(cid);
  renderSlots(cid);
  renderPicker(cid);
  renderBuffs(cid);
  renderStats(cid);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────

function selectClass(cid, cls) {
  const s = state[cid];
  s.cls = cls;
  s.activeSlot = null;
  Object.keys(s.equipped).forEach(k => delete s.equipped[k]);
  render(cid);
}

function openPicker(cid, slotId) {
  const s = state[cid];
  s.activeSlot = (s.activeSlot === slotId) ? null : slotId;
  renderSlots(cid);
  renderPicker(cid);
}

function equipSlot(cid, slotId, quality) {
  const s = state[cid];
  const stats = getStatsForSlot(s.cls, slotId, quality);
  s.equipped[slotId] = { quality, stats };
  s.activeSlot = null;
  renderSlots(cid);
  renderPicker(cid);
  renderStats(cid);
}

function unequipActiveSlot(cid) {
  const s = state[cid];
  if (!s.activeSlot) return;
  delete s.equipped[s.activeSlot];
  s.activeSlot = null;
  renderSlots(cid);
  renderPicker(cid);
  renderStats(cid);
}

function resetAll(cid) {
  const s = state[cid];
  Object.keys(s.equipped).forEach(k => delete s.equipped[k]);
  s.activeSlot = null;
  renderSlots(cid);
  renderPicker(cid);
  renderStats(cid);
}

function toggleBuff(cid, i) {
  const s = state[cid];
  if (s.buffs.has(i)) s.buffs.delete(i); else s.buffs.add(i);
  renderBuffs(cid);
  renderStats(cid);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render('c1');
</script>
</body>
</html>
