<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор характеристик — Королевство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold:      #d4a843;
  --gold-l:    #f5d878;
  --gold-d:    #a07d2b;
  --gold-tint: 212,168,67;
  --bg:        #0b0907;
  --bg2:       #120e09;
  --bg3:       #1a160f;
  --bg4:       #211810;
  --line:      rgba(212,168,67,.09);
  --line2:     rgba(212,168,67,.18);
  --txt:       #ece4cf;
  --txt2:      #a99775;
  --txt3:      #6c5d44;
  --serif:     'Fraunces', Georgia, serif;
  --sans:      'Inter', system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.top{
  height:52px;padding:0 28px;
  border-bottom:1px solid var(--line);
  background:rgba(11,9,7,.9);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:16px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:24px;height:24px;filter:drop-shadow(0 0 8px rgba(212,168,67,.4))}
.logo-n{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:-.01em}
.nav{margin-left:16px;display:flex;gap:2px}
.nav a{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--txt2);font-weight:500;transition:background .12s,color .12s}
.nav a:hover{color:var(--txt);background:var(--bg2)}
.nav a.on{color:var(--gold-l);background:var(--bg3)}
.h-back{margin-left:auto;font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:5px;transition:color .15s}
.h-back:hover{color:var(--gold-l)}
.h-back::before{content:'←'}

/* ── PAGE ── */
.page{padding:28px 32px 80px;max-width:1320px;margin:0 auto}
.page-head{margin-bottom:20px}
.page-title{font-family:var(--serif);font-size:26px;font-weight:500;letter-spacing:-.015em;margin-bottom:2px}
.page-sub{font-size:11px;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}

.calc-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items:start;
}

/* ── CHARACTER BLOCK ── */
.char-block{
  background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  overflow:visible;
  display:flex;flex-direction:column;
}
.char-block-head{
  display:flex;align-items:center;
  padding:12px 18px 10px;
  border-bottom:1px solid var(--line);
}
.char-block-label{
  font-family:var(--serif);font-size:14px;font-weight:500;color:var(--txt3);
}
.char-block-inner{
  padding:14px 16px;
  display:flex;flex-direction:column;
  gap:12px;
}

/* ── CONTROLS ROW ── */
.char-controls{display:flex;align-items:center;gap:8px}
.nickname-input{
  flex:1;padding:7px 11px;
  background:var(--bg3);border:1px solid var(--line);border-radius:7px;
  font-size:13px;font-family:var(--sans);color:var(--txt);outline:none;
  transition:border-color .15s;
}
.nickname-input::placeholder{color:var(--txt3)}
.nickname-input:focus{border-color:var(--line2)}

/* Class dropdown */
.cls-drop{position:relative;flex-shrink:0}
.cls-dd-trigger{
  display:flex;align-items:center;gap:7px;
  padding:6px 10px;
  background:var(--bg3);border:1px solid var(--line2);border-radius:7px;
  cursor:pointer;font-size:13px;color:var(--txt2);font-weight:500;
  transition:background .12s,color .12s;user-select:none;white-space:nowrap;
}
.cls-dd-trigger:hover{background:var(--bg4);color:var(--txt)}
.cls-drop.open .cls-dd-trigger{color:var(--gold-l);border-color:rgba(var(--gold-tint),.3)}
.cls-dd-ico{width:16px;height:16px;border-radius:2px;flex-shrink:0;object-fit:cover}
.cls-dd-arrow{width:10px;height:10px;opacity:.6;transition:transform .15s;flex-shrink:0}
.cls-drop.open .cls-dd-arrow{transform:rotate(180deg)}
.cls-dd-menu{
  display:none;position:absolute;top:calc(100% + 6px);right:0;
  background:var(--bg3);border:1px solid var(--line2);border-radius:9px;
  padding:5px;min-width:160px;z-index:200;
  box-shadow:0 12px 32px rgba(0,0,0,.6);
}
.cls-drop.open .cls-dd-menu{display:block}
.cls-dd-item{
  display:flex;align-items:center;gap:8px;
  padding:7px 10px;border-radius:6px;
  font-size:13px;color:var(--txt2);font-weight:500;cursor:pointer;
  transition:background .1s,color .1s;
}
.cls-dd-item:hover{background:var(--bg4);color:var(--txt)}
.cls-dd-item.on{color:var(--gold-l)}
.cls-dd-item img{width:16px;height:16px;border-radius:2px;object-fit:cover}

/* ── PAPERDOLL MIDDLE ── */
/* left col | char figure | right col */
.paperdoll-middle{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:6px;
  align-items:stretch;
}

/* ── VERTICAL SLOT COLUMNS ── */
.slot-col-vert{display:flex;flex-direction:column;gap:4px;justify-content:space-between}

.slot-vert{
  display:flex;align-items:center;gap:6px;
  padding:4px 6px;border-radius:7px;
  background:var(--bg3);border:1px solid var(--line);
  cursor:pointer;
  transition:border-color .15s,background .15s;
  min-width:0;
}
.slot-vert:hover{border-color:var(--line2);background:var(--bg4)}
.slot-vert.active{border-color:var(--gold)}
.slot-vert.equipped{border-color:var(--line2)}

/* Left column: icon on right (faces character), name on left */
.slot-col-vert.left .slot-vert{flex-direction:row-reverse}
.slot-col-vert.left .slot-vert-name{text-align:right}

.slot-vert-ico{
  width:32px;height:32px;flex-shrink:0;
  background:var(--bg4);border:1px solid var(--line);border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.slot-vert-ico img.item-img{width:32px;height:32px;object-fit:none}
.slot-vert-ico img.frame-img{position:absolute;inset:0;width:32px;height:32px;pointer-events:none}
.slot-vert-ico .ico-empty{opacity:.15}

.slot-vert-name{
  flex:1;min-width:0;
  font-size:10px;color:var(--txt3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  line-height:1.2;
}
.slot-vert.equipped .slot-vert-name{color:var(--txt2)}
.slot-vert.active .slot-vert-name{color:var(--gold-l)}

/* ── CHARACTER FIGURE ── */
.char-figure-wrap{
  width:160px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  position:relative;overflow:hidden;
  min-height:260px;
}
.char-figure{max-width:100%;max-height:300px;object-fit:contain;display:block}
.char-figure-empty{
  font-family:var(--serif);font-style:italic;font-size:12px;color:var(--txt3);
}

/* ── BOTTOM SLOT ROWS (7 per row) ── */
.slot-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.slot-cell{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;
}
.slot-cell-ico{
  width:100%;aspect-ratio:1;max-width:44px;
  background:var(--bg3);border:1px solid var(--line);border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  transition:border-color .15s,background .15s;
}
.slot-cell:hover .slot-cell-ico{border-color:var(--line2);background:var(--bg4)}
.slot-cell.active .slot-cell-ico{border-color:var(--gold)}
.slot-cell.equipped .slot-cell-ico{border-color:var(--line2)}
.slot-cell-ico img.item-img{width:32px;height:32px;object-fit:none}
.slot-cell-ico img.frame-img{position:absolute;inset:0;width:32px;height:32px;pointer-events:none}
.slot-cell-ico .ico-empty{opacity:.15}
.slot-cell-name{
  font-size:9px;color:var(--txt3);text-align:center;
  line-height:1.2;overflow-wrap:break-word;word-break:break-word;max-width:100%;
}
.slot-cell.equipped .slot-cell-name{color:var(--txt2)}
.slot-cell.active .slot-cell-name{color:var(--gold-l)}

/* ── QUALITY PICKER ── */
.picker-panel{
  display:none;
  background:var(--bg3);border:1px solid var(--line2);border-radius:10px;
  padding:12px 14px;
  animation:fadeIn .13s ease;
}
.picker-panel.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.picker-title{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:8px}
.picker-btns{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.picker-btn{
  padding:5px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;
  background:var(--bg4);border:1px solid var(--line);
  transition:border-color .12s;
}
.picker-btn:hover{border-color:var(--line2)}
.picker-btn.no-data{opacity:.3;cursor:default;pointer-events:none}
.picker-btn.equipped-q{outline:2px solid currentColor;outline-offset:1px}
.picker-unequip{
  padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;font-family:var(--sans);
  background:transparent;border:1px dashed var(--line2);color:var(--txt3);
  transition:color .12s,border-color .12s;
}
.picker-unequip:hover{color:var(--txt2);border-color:rgba(212,168,67,.3)}

/* ── BUFFS ── */
.buffs-title{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;margin-bottom:8px}
.buffs-list{display:flex;flex-wrap:wrap;gap:5px}
.buff-toggle{
  display:flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:6px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--line);
  font-size:11px;color:var(--txt2);font-weight:500;
  transition:border-color .12s,color .12s,background .12s;user-select:none;
}
.buff-toggle:hover{border-color:var(--line2);color:var(--txt)}
.buff-toggle.on{border-color:rgba(212,168,67,.35);color:var(--gold-l);background:rgba(212,168,67,.06)}
.buff-check{
  width:12px;height:12px;border-radius:3px;
  border:1px solid var(--line2);background:var(--bg4);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:8px;
}
.buff-toggle.on .buff-check{background:rgba(212,168,67,.15);border-color:var(--gold);color:var(--gold-l)}
.buff-cls-badge{font-size:10px;color:var(--txt3);font-weight:400}

/* ── STATS PANEL ── */
.stats-panel{background:var(--bg3);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats-header{
  padding:10px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.stats-title{font-family:var(--serif);font-size:14px;font-weight:500;color:var(--txt)}
.stats-hint{font-size:11px;color:var(--txt3);font-style:italic}
.stat-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 14px;border-bottom:1px solid rgba(212,168,67,.04);
  transition:background .1s;
}
.stat-row:last-child{border-bottom:none}
.stat-row:hover{background:rgba(212,168,67,.02)}
.stat-key{font-size:12px;color:var(--txt2)}
.stat-val{font-family:var(--serif);font-size:13px;color:var(--gold-l);font-feature-settings:'tnum';font-weight:500}
.stat-empty{color:var(--txt3);font-size:12px;font-style:italic;padding:18px 14px;text-align:center}
.stat-buff-tag{font-size:10px;color:var(--gold);margin-left:4px;font-family:var(--sans)}

/* ── PLACEHOLDER ── */
.char-block-placeholder{
  display:flex;align-items:center;justify-content:center;
  min-height:460px;
  font-family:var(--serif);font-style:italic;font-size:15px;color:var(--txt3);
}

/* ── MOBILE ── */
@media(max-width:1000px){.calc-layout{grid-template-columns:1fr}}
@media(max-width:600px){
  .page{padding:20px 16px 60px}
  .top{padding:0 14px}
  .nav{display:none}
  .char-figure-wrap{width:120px;min-height:200px}
  .slot-vert-name{display:none}
}
</style>
</head>

  { key:'light_res',   label:'Сопр. магии света',      pct:true },
  { key:'elem_def',    label:'Защита стихий' },
  { key:'def_eff',     label:'Эффективность защиты',   pct:true },
  { key:'atk_eff',     label:'Эффективность атаки',    pct:true },
  { key:'speed',       label:'Скорость в бою',         pct:true },
];

const CLASS_BUFFS = [
  { name:'Зоркий глаз',   cls:'archer',  effect:'atk_eff',       value:15 },
  { name:'Ураган',        cls:'mage',    effect:'atk_eff',       value:15 },
  { name:'Благословение', cls:'monk',    effect:'hp',            value:8,  pct:true },
  { name:'Святое слово',  cls:'paladin', effect:'hp',            value:8,  pct:true },
  { name:'Пылающий щит',  cls:'warrior', effect:'dmg_taken_red', value:8 },
  { name:'Дар теней',     cls:'rogue',   effect:'dmg_taken_red', value:8 },
];

const STATS = {
  warrior: {
    red: {
      weapon:  { atk:12.72, def:37.85, hp:694,  mana:80,  heal_eff:5, hp_regen:50, crit_dmg:5, wind_res:0.80, elem_def:35, atk_eff:2 },
      pants:   { atk:14.53, def:15.03, hp:713,  mana:120, heal_eff:5, hp_regen:50, crit_dmg:5, wind_res:0.80, elem_def:53, atk_eff:2 },
      belt:    { atk:15.56, def:8.56,  hp:725,  mana:150, heal_eff:5, hp_regen:50, crit_dmg:5, wind_res:0.80, elem_def:72, atk_eff:2 },
      boots:   { atk:20.04, def:5.65,  hp:750,  mana:170, heal_eff:5, hp_regen:50, crit_dmg:5, wind_res:0.80, elem_def:92, atk_eff:2 },
    },
  },
  paladin: {
    green: {
      weapon:  { atk:5.70, def:28.47, hp:450, mana:15, fire_res:0.50 },
      pants:   { atk:6.75, def:14.23, hp:465, mana:24, fire_res:0.50 },
      belt:    { atk:7.20, def:8.59,  hp:485, mana:30, fire_res:0.50 },
      boots:   { atk:9.70, def:5.61,  hp:510, mana:36, fire_res:0.50 },
      gloves:  { atk:10.75,def:3.94,  hp:530, mana:42, fire_res:0.50 },
    },
    red: {
      weapon:  { atk:10.18, def:37.83, hp:949,  mana:80,  heal_eff:5, hp_regen:50, crit_dmg:5, fire_res:0.80, elem_def:35, atk_eff:2 },
      pants:   { atk:11.64, def:17.84, hp:954,  mana:120, heal_eff:5, hp_regen:50, crit_dmg:5, fire_res:0.80, elem_def:53, atk_eff:2 },
      belt:    { atk:12.41, def:10.32, hp:985,  mana:150, heal_eff:5, hp_regen:50, crit_dmg:5, fire_res:0.80, elem_def:72, atk_eff:2 },
      boots:   { atk:16.57, def:6.63,  hp:1023, mana:170, heal_eff:5, hp_regen:50, crit_dmg:5, fire_res:0.80, elem_def:92, atk_eff:2 },
    },
    purple_plus: {
      gloves:  { atk:16.30, def:4.78, hp:855, mana:170, heal_eff:5, fire_res:0.80, elem_def:124 },
    },
  },
};

// ── STATE ─────────────────────────────────────────────────────────────────────

const state = {
  c1: { cls:'paladin', activeSlot:null, equipped:{}, buffs:new Set() },
  c2: { cls:'paladin', activeSlot:null, equipped:{}, buffs:new Set() },
};

// ── HELPERS ───────────────────────────────────────────────────────────────────

function getStatsForSlot(cls, slotId, quality) {
  return STATS[cls]?.[quality]?.[slotId] || null;
}

function getItemImg(cls, slotId, quality) {
  return null; // expand as image library grows
}

function slotIcoHtml(cid, slotId, eq) {
  if (!eq) return `<svg class="ico-empty" width="16" height="16" viewBox="0 0 16 16" fill="none">
    <rect x="1.5" y="1.5" width="13" height="13" rx="2.5" stroke="currentColor" stroke-width="1.3" stroke-dasharray="3 2"/>
  </svg>`;
  const s = state[cid];
  const imgSrc   = getItemImg(s.cls, slotId, eq.quality);
  const frameSrc = QUALITY_FRAME[eq.quality];
  const qColor   = QUALITIES.find(q => q.id === eq.quality)?.color;
  return `${imgSrc   ? `<img class="item-img"  src="${imgSrc}"   alt="">` : ''}
          ${frameSrc ? `<img class="frame-img" src="${frameSrc}" alt="">` : ''}
          ${!imgSrc && qColor ? `<div style="width:10px;height:10px;border-radius:50%;background:${qColor}"></div>` : ''}`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function renderClsDropdown(cid) {
  const s = state[cid];
  document.getElementById(`clsDdLabel-${cid}`).textContent = CLASS_NAMES[s.cls];
  document.getElementById(`clsDdIco-${cid}`).src = `stats_calculator/classes/${CLASS_ICON_FILE[s.cls]}`;
  document.getElementById(`clsDdMenu-${cid}`).innerHTML = Object.keys(CLASS_NAMES).map(cls =>
    `<div class="cls-dd-item${cls === s.cls ? ' on' : ''}" onclick="selectClass('${cid}','${cls}')">
      <img src="stats_calculator/classes/${CLASS_ICON_FILE[cls]}" alt="" onerror="this.style.display='none'">
      ${CLASS_NAMES[cls]}
    </div>`
  ).join('');
}

function renderSlotCol(cid, slots, containerId) {
  const s = state[cid];
  document.getElementById(containerId).innerHTML = slots.map(slot => {
    const eq = s.equipped[slot.id];
    const isActive = s.activeSlot === slot.id;
    const qColor = eq ? QUALITIES.find(q => q.id === eq.quality)?.color : null;
    const cls = ['slot-vert', isActive ? 'active' : '', eq ? 'equipped' : ''].filter(Boolean).join(' ');
    const nameStyle = isActive ? 'color:var(--gold-l)' : (eq && qColor ? `color:${qColor}` : '');
    return `<div class="${cls}" onclick="openPicker('${cid}','${slot.id}')">
      <div class="slot-vert-ico">${slotIcoHtml(cid, slot.id, eq)}</div>
      <div class="slot-vert-name" style="${nameStyle}">${slot.short}</div>
    </div>`;
  }).join('');
}

function renderSlotRow(cid, rowSlots, containerId) {
  const s = state[cid];
  document.getElementById(containerId).innerHTML = rowSlots.map(slot => {
    const eq = s.equipped[slot.id];
    const isActive = s.activeSlot === slot.id;
    const qColor = eq ? QUALITIES.find(q => q.id === eq.quality)?.color : null;
    const cls = ['slot-cell', isActive ? 'active' : '', eq ? 'equipped' : ''].filter(Boolean).join(' ');
    const nameStyle = isActive ? 'color:var(--gold-l)' : (eq && qColor ? `color:${qColor}` : '');
    return `<div class="${cls}" onclick="openPicker('${cid}','${slot.id}')">
      <div class="slot-cell-ico">${slotIcoHtml(cid, slot.id, eq)}</div>
      <div class="slot-cell-name" style="${nameStyle}">${slot.short}</div>
    </div>`;
  }).join('');
}

function renderPicker(cid) {
  const s     = state[cid];
  const panel = document.getElementById(`pickerPanel-${cid}`);
  const title = document.getElementById(`pickerTitle-${cid}`);
  const btns  = document.getElementById(`pickerBtns-${cid}`);
  if (!s.activeSlot) { panel.classList.remove('open'); return; }
  const slot = ALL_SLOTS.find(sl => sl.id === s.activeSlot);
  title.textContent = slot?.name || s.activeSlot;
  btns.innerHTML = QUALITIES.map(q => {
    const hasStats = !!getStatsForSlot(s.cls, s.activeSlot, q.id);
    const isEq = s.equipped[s.activeSlot]?.quality === q.id;
    return `<button class="picker-btn${hasStats ? '' : ' no-data'}${isEq ? ' equipped-q' : ''}"
      style="color:${q.color}" onclick="equipSlot('${cid}','${s.activeSlot}','${q.id}')"
      ${hasStats ? '' : 'disabled'}>${q.label}</button>`;
  }).join('');
  panel.classList.add('open');
}

function renderBuffs(cid) {
  const s = state[cid];
  document.getElementById(`buffsList-${cid}`).innerHTML = CLASS_BUFFS.map((b, i) => {
    const on = s.buffs.has(i) ? ' on' : '';
    return `<div class="buff-toggle${on}" onclick="toggleBuff('${cid}',${i})">
      <div class="buff-check">${s.buffs.has(i) ? '✓' : ''}</div>
      ${b.name} <span class="buff-cls-badge">(${CLASS_NAMES[b.cls]})</span>
    </div>`;
  }).join('');
}

function renderStats(cid) {
  const s    = state[cid];
  const body = document.getElementById(`statsBody-${cid}`);
  const hint = document.getElementById(`statsHint-${cid}`);
  const totals = {};
  let hasAny = false;
  Object.values(s.equipped).forEach(eq => {
    if (!eq?.stats) return;
    hasAny = true;
    Object.entries(eq.stats).forEach(([k, v]) => { totals[k] = (totals[k] || 0) + v; });
  });
  if (!hasAny) {
    hint.textContent = 'выберите предметы';
    body.innerHTML = `<div class="stat-empty">Выберите предметы, чтобы увидеть характеристики</div>`;
    return;
  }
  const cnt = Object.keys(s.equipped).length;
  hint.textContent = `${cnt} ${cnt === 1 ? 'предмет' : cnt < 5 ? 'предмета' : 'предметов'}`;
  const buffEffects = {};
  s.buffs.forEach(i => {
    const b = CLASS_BUFFS[i];
    if (!b || b.effect === 'dmg_taken_red') return;
    const bonus = b.pct ? (totals[b.effect] || 0) * b.value / 100 : b.value;
    buffEffects[b.effect] = (buffEffects[b.effect] || 0) + bonus;
  });
  const dmgRed = CLASS_BUFFS.filter((b,i) => b.effect==='dmg_taken_red' && s.buffs.has(i))
    .reduce((s,b) => s+b.value, 0);
  let html = '';
  STAT_LABELS.forEach(meta => {
    const base  = totals[meta.key] || 0;
    const bonus = buffEffects[meta.key] || 0;
    const total = base + bonus;
    if (total === 0) return;
    const valStr = meta.pct
      ? `+${total.toFixed(2).replace(/\.00$/, '')}%`
      : (Number.isInteger(total) ? String(total) : total.toFixed(2));
    const buffTag = bonus > 0
      ? `<span class="stat-buff-tag">+${meta.pct ? bonus.toFixed(1)+'%' : Math.round(bonus)} бафф</span>` : '';
    html += `<div class="stat-row">
      <span class="stat-key">${meta.label}</span>
      <span class="stat-val">${valStr}${buffTag}</span>
    </div>`;
  });
  if (dmgRed > 0) html += `<div class="stat-row">
    <span class="stat-key">Снижение урона (бафф)</span>
    <span class="stat-val">−${dmgRed}%</span>
  </div>`;
  if (!html) html = `<div class="stat-empty">Нет данных для выбранных слотов</div>`;
  body.innerHTML = html;
}

function renderAll(cid) {
  renderClsDropdown(cid);
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
  renderBuffs(cid);
  renderStats(cid);
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────

function toggleClsDrop(cid) {
  document.getElementById(`clsDrop-${cid}`).classList.toggle('open');
}

function selectClass(cid, cls) {
  const s = state[cid];
  s.cls = cls; s.activeSlot = null;
  Object.keys(s.equipped).forEach(k => delete s.equipped[k]);
  document.getElementById(`clsDrop-${cid}`).classList.remove('open');
  renderAll(cid);
}

function openPicker(cid, slotId) {
  const s = state[cid];
  s.activeSlot = (s.activeSlot === slotId) ? null : slotId;
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
}

function equipSlot(cid, slotId, quality) {
  const s = state[cid];
  s.equipped[slotId] = { quality, stats: getStatsForSlot(s.cls, slotId, quality) };
  s.activeSlot = null;
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
  renderStats(cid);
}

function unequipActiveSlot(cid) {
  const s = state[cid];
  if (!s.activeSlot) return;
  delete s.equipped[s.activeSlot];
  s.activeSlot = null;
  renderSlotCol(cid, COL_LEFT,  `colLeft-${cid}`);
  renderSlotCol(cid, COL_RIGHT, `colRight-${cid}`);
  renderSlotRow(cid, ROW_TOP,   `slotRowTop-${cid}`);
  renderSlotRow(cid, ROW_BOT,   `slotRowBot-${cid}`);
  renderPicker(cid);
  renderStats(cid);
}

function toggleBuff(cid, i) {
  const s = state[cid];
  if (s.buffs.has(i)) s.buffs.delete(i); else s.buffs.add(i);
  renderBuffs(cid);
  renderStats(cid);
}

document.addEventListener('click', e => {
  ['c1','c2'].forEach(cid => {
    const drop = document.getElementById(`clsDrop-${cid}`);
    if (drop && !drop.contains(e.target)) drop.classList.remove('open');
  });
});

// ── INIT ──────────────────────────────────────────────────────────────────────
renderAll('c1');
</script>
