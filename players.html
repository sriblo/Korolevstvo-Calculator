<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поиск игроков — Королевство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e8b84b; --gold-l:#fce87a; --gold-d:#b8912e;
    --gold-tint:232,184,75;
    --bg:#0f0c08; --bg2:#181208; --bg3:#221a0e; --bg4:#2c2010;
    --line:rgba(var(--gold-tint),.14);
    --line2:rgba(var(--gold-tint),.28);
    --txt:#f5ecd8; --txt2:#c8a96e; --txt3:#8a7250;
    --serif:'Fraunces',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 50% at 20% -10%,rgba(var(--gold-tint),.12),transparent 60%),
      radial-gradient(ellipse 50% 40% at 100% 5%,rgba(80,30,15,.18),transparent 60%),
      var(--bg);
  }
  a{color:inherit;text-decoration:none}

  /* ── Top bar ── */
  .top{
    padding:16px 40px;border-bottom:1px solid var(--line);
    background:rgba(11,9,7,.78);backdrop-filter:blur(20px);
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:18px;
  }
  .logo{display:flex;align-items:center;gap:12px}
  .logo img{width:28px;height:28px;filter:drop-shadow(0 0 10px rgba(var(--gold-tint),.4))}
  .logo-n{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1}
  .logo-s{font-size:10px;color:var(--txt3);margin-top:2px;letter-spacing:.02em}
  .nav{margin-left:24px;display:flex;gap:4px}
  .nav a{padding:6px 11px;border-radius:6px;font-size:13px;color:var(--txt2);font-weight:500;transition:background .12s,color .12s}
  .nav a:hover{color:var(--txt);background:var(--bg2)}
  .nav a.on{color:var(--gold-l);background:var(--bg3)}

  /* ── Hero ── */
  .hero{max-width:760px;margin:0 auto;padding:56px 24px 32px}
  .hero h1{font-family:var(--serif);font-size:36px;font-weight:400;line-height:1.15;margin-bottom:10px}
  .hero h1 em{color:var(--gold);font-style:italic}
  .hero p{color:var(--txt2);font-size:14px;line-height:1.6}

  /* ── Search box ── */
  .search-wrap{max-width:760px;margin:0 auto;padding:0 24px 48px}
  .search-box{
    display:flex;align-items:center;gap:0;
    background:var(--bg3);border:1px solid var(--line2);
    border-radius:10px;overflow:hidden;
    transition:border-color .15s;
  }
  .search-box:focus-within{border-color:rgba(var(--gold-tint),.5)}
  .search-icon{padding:0 14px;color:var(--txt3);flex-shrink:0;font-size:16px}
  .search-box input{
    flex:1;background:none;border:none;outline:none;
    color:var(--txt);font-family:var(--sans);font-size:16px;
    padding:14px 0;caret-color:var(--gold);
  }
  .search-box input::placeholder{color:var(--txt3)}
  .search-status{
    padding:0 14px;font-size:12px;color:var(--txt3);
    white-space:nowrap;flex-shrink:0;min-width:80px;text-align:right;
  }
  .hint{margin-top:10px;font-size:12px;color:var(--txt3);padding:0 4px}

  /* ── Results ── */
  .results{max-width:760px;margin:0 auto;padding:0 24px 80px}
  .result-item{
    display:flex;align-items:center;gap:14px;
    padding:12px 16px;border-radius:8px;
    border:1px solid transparent;
    transition:background .12s,border-color .12s;
    cursor:pointer;
  }
  .result-item:hover{background:var(--bg3);border-color:var(--line)}
  .result-item + .result-item{margin-top:4px}

  .race-icon{width:20px;height:20px;object-fit:contain;opacity:.85;flex-shrink:0}
  .player-nick{font-size:15px;font-weight:500;flex:1}
  .player-level{
    font-size:12px;color:var(--txt3);
    background:var(--bg4);border:1px solid var(--line);
    border-radius:4px;padding:2px 7px;flex-shrink:0;
  }
  .player-link{
    font-size:12px;color:var(--txt3);
    padding:4px 10px;border-radius:6px;border:1px solid var(--line);
    transition:.12s;flex-shrink:0;
  }
  .result-item:hover .player-link{color:var(--gold-l);border-color:var(--line2)}

  /* ── Empty / error states ── */
  .state{
    text-align:center;padding:64px 24px;color:var(--txt3);
  }
  .state-icon{font-size:36px;margin-bottom:14px}
  .state p{font-size:14px;line-height:1.6}
  .state strong{color:var(--txt2)}

  .spinner{
    display:inline-block;width:18px;height:18px;
    border:2px solid var(--line2);border-top-color:var(--gold);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── Divider ── */
  .sep{border:none;border-top:1px solid var(--line);margin:0 24px}
</style>
</head>
<body>

<header class="top">
  <a class="logo" id="site-logo" href="index_new.html"></a>
  <nav class="nav" id="site-nav"></nav>
  <script src="nav.js"></script>
</header>

<div class="hero">
  <h1>Поиск <em>игроков</em></h1>
  <p>Введи часть ника — найдём по всей базе Королевства</p>
</div>

<div class="search-wrap">
  <div class="search-box">
    <span class="search-icon">⚔</span>
    <input id="q" type="text" placeholder="Введи часть ника..." autocomplete="off" autofocus spellcheck="false">
    <div class="search-status" id="status"></div>
  </div>
  <div class="hint" id="hint">Минимум 2 символа · показывается до 5 результатов — уточни запрос если не нашёл</div>
</div>

<hr class="sep">

<div class="results" id="results">
  <div class="state">
    <div class="state-icon">🔍</div>
    <p>Начни вводить ник чтобы найти игрока</p>
  </div>
</div>

<script>
// ── Замени на URL своего Cloudflare Worker ──
const WORKER_URL = 'https://plain-sunset-d3bc.sriblomusic.workers.dev';

const RACE_ICONS = {
  human: 'https://m1.kor.ru/media/TheKingdom/img/v2/content/race/race_1.png',
  elf:   'https://m1.kor.ru/media/TheKingdom/img/v2/content/race/race_2.png',
};
const RACE_LABEL = { human: 'Человек', elf: 'Эльф' };

const input   = document.getElementById('q');
const results = document.getElementById('results');
const status  = document.getElementById('status');
const hint    = document.getElementById('hint');

let timer = null;

function setStatus(html) { status.innerHTML = html; }

function renderEmpty(query) {
  results.innerHTML = `
    <div class="state">
      <div class="state-icon">😶</div>
      <p>По запросу <strong>«${esc(query)}»</strong> никого не найдено<br>
      Попробуй другое написание или часть ника</p>
    </div>`;
}

function renderError() {
  results.innerHTML = `
    <div class="state">
      <div class="state-icon">⚠</div>
      <p>Не удалось получить данные<br>
      Возможно, закончилась сессия — попробуй позже</p>
    </div>`;
}

function renderResults(users) {
  if (!users.length) return renderEmpty(input.value);
  results.innerHTML = users.map(u => `
    <a class="result-item" href="${esc(u.url)}" target="_blank" rel="noopener">
      <img class="race-icon" src="${RACE_ICONS[u.race]}" alt="${RACE_LABEL[u.race]}" title="${RACE_LABEL[u.race]}">
      <span class="player-nick">${esc(u.nick)}</span>
      ${u.level ? `<span class="player-level">${u.level} ур.</span>` : ''}
      <span class="player-link">Профиль →</span>
    </a>
  `).join('');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function search(query) {
  setStatus('<span class="spinner"></span>');
  try {
    const r = await fetch(`${WORKER_URL}?q=${encodeURIComponent(query)}`);
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    renderResults(data);
    setStatus(data.length ? `${data.length} из 5` : '');
  } catch(e) {
    renderError();
    setStatus('');
  }
}

input.addEventListener('input', () => {
  clearTimeout(timer);
  const q = input.value.trim();
  if (q.length < 2) {
    setStatus('');
    results.innerHTML = `<div class="state"><div class="state-icon">🔍</div><p>Начни вводить ник чтобы найти игрока</p></div>`;
    return;
  }
  setStatus('...');
  timer = setTimeout(() => search(q), 400);
});
</script>
</body>
</html>
