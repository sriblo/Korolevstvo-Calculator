<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Календарь — Королевство</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');

:root {
  --amber: #b8860b; --gold: #d4a843; --goldl: #f0cc6a;
  --text: #ede5cc; --txt2: #b8a882; --txt3: #7a6a50;
  --bg: #0a0704;

  --c-offer:      #d4a843;
  --c-tournament: #5ab4e0;
  --c-event:      #7acc50;
  --c-fair:       #e09030;
  --c-holiday:    #e060a0;
  --c-season:     #8ab860;
  --c-bonus:      #f0c040;
  --c-tech:       #707060;
  --c-other:      #504030;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; color: var(--text);
  font-family: 'Cormorant Garamond', serif; font-size: 16px;
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 60% at 0% 0%, rgba(120,70,10,.5) 0%, transparent 55%),
    radial-gradient(ellipse 60% 70% at 100% 100%, rgba(90,30,20,.4) 0%, transparent 50%);
}

/* ── HEADER ── */
header {
  position: relative; z-index: 10; padding: 0 40px;
  background: linear-gradient(180deg, rgba(20,13,6,.9) 0%, rgba(10,7,3,.7) 100%);
  border-bottom: 1px solid rgba(184,134,11,.18);
}
.h-inner { max-width: 1200px; margin: 0 auto; padding: 14px 0; display: flex; align-items: center; gap: 16px; }
.h-back {
  text-decoration: none; color: var(--txt2);
  font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: .05em;
  padding: 6px 12px; border: 1px solid rgba(184,134,11,.2); border-radius: 6px;
  transition: color .2s, border-color .2s; flex-shrink: 0;
}
.h-back:hover { color: var(--gold); border-color: rgba(184,134,11,.5); }
.h-title { font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: .08em; }
.h-sub { font-size: 13px; color: var(--txt2); font-style: italic; }

/* ── PAGE ── */
.page { max-width: 1200px; margin: 0 auto; padding: 24px 40px 80px; }

/* ── FILTERS ── */
.filters {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
  padding: 14px 16px;
  background: rgba(10,7,3,.7); border: 1px solid rgba(184,134,11,.1); border-radius: 10px;
}
.filter-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px; color: var(--txt3); text-transform: uppercase; display: flex; align-items: center; margin-right: 4px; }
.ftag {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 20px; cursor: pointer; user-select: none;
  font-size: 13px; border: 1px solid; transition: opacity .15s, background .15s;
}
.ftag.off { opacity: .3; }
.ftag-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── CALENDAR NAV ── */
.cal-nav {
  display: flex; align-items: center; gap: 0;
  margin-bottom: 16px; border-radius: 10px; overflow: hidden;
  border: 1px solid rgba(184,134,11,.14);
  background: rgba(10,7,3,.7);
}
.nav-arrow {
  padding: 12px 16px; cursor: pointer; font-size: 18px; color: var(--txt3);
  background: none; border: none; font-family: inherit;
  transition: color .15s, background .15s; flex-shrink: 0;
}
.nav-arrow:hover { color: var(--gold); background: rgba(184,134,11,.06); }
.nav-cur {
  font-family: 'Cinzel', serif; font-size: 15px; font-weight: 700;
  color: var(--goldl); letter-spacing: .08em; padding: 0 4px; min-width: 200px; text-align: center;
}
.month-tabs { display: flex; flex: 1; overflow-x: auto; }
.month-tabs::-webkit-scrollbar { height: 3px; }
.month-tabs::-webkit-scrollbar-thumb { background: rgba(184,134,11,.3); }
.mtab {
  flex-shrink: 0; padding: 12px 10px; cursor: pointer;
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .05em;
  color: var(--txt3); border-left: 1px solid rgba(184,134,11,.08);
  transition: color .15s, background .15s; white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.mtab:hover { color: var(--txt2); background: rgba(184,134,11,.04); }
.mtab.active { color: var(--goldl); border-bottom-color: var(--gold); background: rgba(184,134,11,.08); }
.mtab.has-data { color: var(--txt2); }

/* ── CALENDAR GRID ── */
.cal-wrap { background: rgba(10,7,3,.6); border: 1px solid rgba(184,134,11,.12); border-radius: 10px; overflow: hidden; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); background: rgba(184,134,11,.05); border-bottom: 1px solid rgba(184,134,11,.12); }
.cal-dow > div { padding: 9px 0; text-align: center; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px; color: var(--txt3); text-transform: uppercase; }

/* Week row */
.week { border-bottom: 1px solid rgba(184,134,11,.08); }
.week:last-child { border-bottom: none; }

/* Day numbers row */
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); }
.wday {
  padding: 6px 8px 4px; min-height: 34px; position: relative;
  border-right: 1px solid rgba(184,134,11,.06);
  cursor: pointer; transition: background .12s; user-select: none;
}
.wday:last-child { border-right: none; }
.wday:hover { background: rgba(184,134,11,.05); }
.wday.other-month { opacity: .18; pointer-events: none; }
.wday.future { opacity: .55; }
.wday.selected { background: rgba(184,134,11,.12); }
.wday-num {
  font-family: 'Cinzel', serif; font-size: 12px; color: var(--txt3);
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
}
.wday.today .wday-num { background: rgba(212,168,67,.22); color: var(--goldl); font-weight: 700; }

/* Event bars area */
.week-events {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: 22px;
  padding: 2px 0 5px;
}
.ev-bar {
  height: 20px; margin: 1px 2px;
  border-radius: 3px;
  font-size: 11px; line-height: 20px;
  padding: 0 7px;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  cursor: pointer;
  background: color-mix(in srgb, var(--color) 22%, transparent);
  border: 1px solid color-mix(in srgb, var(--color) 50%, transparent);
  color: var(--color);
  transition: filter .12s;
}
/* Fallback for browsers without color-mix */
@supports not (background: color-mix(in srgb, red 50%, transparent)) {
  .ev-bar { background: rgba(0,0,0,.3); border-color: rgba(255,255,255,.2); }
}
.ev-bar:hover { filter: brightness(1.25); }
/* Continuation from previous week — no left border, no left radius */
.ev-bar.ev-cont { border-left: none; border-radius: 0 3px 3px 0; padding-left: 4px; }
/* Continues to next week — no right border, no right radius */
.ev-bar.ev-goes { border-right: none; border-radius: 3px 0 0 3px; }
/* Both: continuation and continues */
.ev-bar.ev-cont.ev-goes { border-radius: 0; }

.ev-more-row {
  grid-column: 1 / 8; font-size: 11px; color: var(--txt3);
  padding: 0 8px; line-height: 20px; font-style: italic;
}

/* ── DETAIL PANEL ── */
.detail {
  margin-top: 16px; background: rgba(10,7,3,.85);
  border: 1px solid rgba(184,134,11,.25); border-radius: 10px; overflow: hidden;
}
.detail-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: rgba(184,134,11,.07);
  border-bottom: 1px solid rgba(184,134,11,.15);
}
.detail-date-label {
  font-family: 'Cinzel', serif; font-size: 14px; font-weight: 700;
  color: var(--goldl); letter-spacing: .06em;
}
.detail-close {
  background: none; border: none; color: var(--txt3); font-size: 20px;
  cursor: pointer; padding: 0 4px; line-height: 1; font-family: inherit;
  transition: color .15s;
}
.detail-close:hover { color: var(--gold); }
.detail-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.detail-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 7px;
  background: rgba(184,134,11,.04); border: 1px solid rgba(184,134,11,.1);
}
.detail-ico { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.detail-info { flex: 1; }
.detail-title { font-size: 15px; color: var(--text); line-height: 1.3; font-weight: 600; }
.detail-meta { font-size: 12px; color: var(--txt3); margin-top: 3px; }
.detail-cat-badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  border: 1px solid; font-family: 'Cinzel', serif; letter-spacing: .03em;
}
.detail-link {
  font-size: 12px; color: var(--txt3); text-decoration: none;
  border: 1px solid rgba(184,134,11,.2); border-radius: 4px;
  padding: 2px 8px; margin-left: 6px; transition: color .15s, border-color .15s;
  white-space: nowrap; flex-shrink: 0;
}
.detail-link:hover { color: var(--gold); border-color: rgba(184,134,11,.5); }
.detail-duration {
  font-size: 12px; color: var(--txt2); margin-top: 4px;
}
.detail-duration.approx { color: var(--txt3); font-style: italic; }

/* ── YEAR SELECTOR ── */
.year-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ytab {
  padding: 5px 11px; border-radius: 6px; cursor: pointer;
  font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: .05em;
  border: 1px solid rgba(184,134,11,.18); background: rgba(10,7,3,.6);
  color: var(--txt3); transition: all .15s; user-select: none;
}
.ytab:hover { border-color: rgba(184,134,11,.4); color: var(--txt2); }
.ytab.active { background: rgba(184,134,11,.18); border-color: rgba(184,134,11,.55); color: var(--goldl); }

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  header { padding: 0 16px; }
  .page { padding: 16px 12px 60px; }
  .ev-bar { font-size: 10px; padding: 0 3px; }
}
</style>
</head>
<body>

<header>
  <div class="h-inner">
    <a href="index.html" class="h-back">← Назад</a>
    <div>
      <div class="h-title">Календарь</div>
      <div class="h-sub">Ивенты · Турниры · Акции · 2008–2026</div>
    </div>
  </div>
</header>

<div class="page">

  <!-- Фильтры -->
  <div class="filters" id="filtersRow"></div>

  <!-- Выбор года -->
  <div class="year-nav" id="yearNav"></div>

  <!-- Выбор месяца -->
  <div class="cal-nav">
    <button class="nav-arrow" id="btnPrev">‹</button>
    <div class="nav-cur" id="navCur"></div>
    <div class="month-tabs" id="monthTabs"></div>
    <button class="nav-arrow" id="btnNext">›</button>
  </div>

  <!-- Календарная сетка -->
  <div class="cal-wrap">
    <div class="cal-dow">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div id="calBody"></div>
  </div>

  <!-- Детали дня -->
  <div class="detail" id="detailPanel" style="display:none">
    <div class="detail-head">
      <span class="detail-date-label" id="detailDateLabel"></span>
      <button class="detail-close" id="detailClose">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>

</div>

<script>
// ══════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════
const MONTHS_NOM  = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN  = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW_RU      = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const TODAY       = new Date();
const TODAY_STR   = isoDate(TODAY);

const CAT_META = {
  offer:          { label:'Акции',          ico:'🎁', color:'var(--c-offer)',      group:'offer' },
  bonus:          { label:'Бонус рубины',   ico:'💎', color:'var(--c-bonus)',      group:'offer' },
  tournament:     { label:'Турнир (старт)', ico:'⚔️', color:'var(--c-tournament)', group:'tournament' },
  tournament_end: { label:'Турнир (итог)',  ico:'🏆', color:'var(--c-tournament)', group:'tournament' },
  event:          { label:'Ивенты',         ico:'🎭', color:'var(--c-event)',      group:'event' },
  fair:           { label:'Ярмарки',        ico:'🛒', color:'var(--c-fair)',       group:'fair' },
  holiday:        { label:'Праздники',      ico:'🎉', color:'var(--c-holiday)',    group:'holiday' },
  season:         { label:'Сезоны',         ico:'📅', color:'var(--c-season)',     group:'season' },
  maintenance:    { label:'Техработы',      ico:'🔧', color:'var(--c-tech)',       group:'tech' },
  update:         { label:'Обновления',     ico:'📋', color:'var(--c-tech)',       group:'tech' },
  auction:        { label:'Аукционы',       ico:'🎨', color:'var(--c-other)',      group:'other' },
  other:          { label:'Прочее',         ico:'📰', color:'var(--c-other)',      group:'other' },
};

// Группы для фильтра (каждый тоггл управляет группой)
const FILTER_GROUPS = [
  { id:'offer',      label:'Акции',      ico:'🎁', cats:['offer','bonus'],              on:true  },
  { id:'tournament', label:'Турниры',    ico:'⚔️', cats:['tournament','tournament_end'], on:true  },
  { id:'event',      label:'Ивенты',     ico:'🎭', cats:['event'],                      on:true  },
  { id:'fair',       label:'Ярмарки',    ico:'🛒', cats:['fair'],                       on:true  },
  { id:'holiday',    label:'Праздники',  ico:'🎉', cats:['holiday'],                    on:true  },
  { id:'season',     label:'Сезоны',     ico:'📅', cats:['season'],                     on:true  },
  { id:'tech',       label:'Техническое',ico:'🔧', cats:['maintenance','update'],        on:false },
  { id:'other',      label:'Прочее',     ico:'📰', cats:['auction','other'],             on:false },
];

const GROUP_COLOR = {
  offer:'var(--c-offer)', tournament:'var(--c-tournament)', event:'var(--c-event)',
  fair:'var(--c-fair)', holiday:'var(--c-holiday)', season:'var(--c-season)',
  tech:'var(--c-tech)', other:'var(--c-other)',
};

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let allNews = [];
let curYear = TODAY.getFullYear();
let curMonth= TODAY.getMonth(); // 0-based
let selectedDay = null;
const filterState = {};  // group.id → bool

FILTER_GROUPS.forEach(g => { filterState[g.id] = g.on; });

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseIso(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function isVisible(cat) {
  const g = FILTER_GROUPS.find(fg => fg.cats.includes(cat));
  return g ? filterState[g.id] : false;
}

// ══════════════════════════════════════════
//  BUILD FILTERS UI
// ══════════════════════════════════════════
function buildFilters() {
  const row = document.getElementById('filtersRow');
  row.innerHTML = '<span class="filter-label">Показать:</span>';
  FILTER_GROUPS.forEach(g => {
    const el = document.createElement('div');
    el.className = 'ftag' + (filterState[g.id] ? '' : ' off');
    el.style.cssText = `border-color:${GROUP_COLOR[g.id]}33;background:${GROUP_COLOR[g.id]}18;color:${GROUP_COLOR[g.id]};`;
    el.innerHTML = `<span class="ftag-dot" style="background:${GROUP_COLOR[g.id]}"></span>${g.ico} ${g.label}`;
    el.addEventListener('click', () => {
      filterState[g.id] = !filterState[g.id];
      el.classList.toggle('off', !filterState[g.id]);
      renderCalendar();
    });
    row.appendChild(el);
  });
}

// ══════════════════════════════════════════
//  BUILD YEAR TABS
// ══════════════════════════════════════════
function buildYearNav() {
  const years = [...new Set(allNews.map(n => n.d.substring(0,4)))].sort().reverse();
  const nav = document.getElementById('yearNav');
  nav.innerHTML = '';
  years.forEach(y => {
    const el = document.createElement('div');
    el.className = 'ytab' + (String(curYear) === y ? ' active' : '');
    el.textContent = y;
    el.addEventListener('click', () => {
      curYear = parseInt(y);
      document.querySelectorAll('.ytab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      buildMonthTabs();
      renderCalendar();
    });
    nav.appendChild(el);
  });
}

// ══════════════════════════════════════════
//  BUILD MONTH TABS
// ══════════════════════════════════════════
function buildMonthTabs() {
  const tabs = document.getElementById('monthTabs');
  tabs.innerHTML = '';
  // Count events per month for this year
  const monthCounts = Array(12).fill(0);
  allNews.forEach(n => {
    if (n.d.startsWith(String(curYear)) && isVisible(n.c)) {
      const m = parseInt(n.d.substring(5,7)) - 1;
      monthCounts[m]++;
    }
  });
  MONTHS_NOM.forEach((name, idx) => {
    const el = document.createElement('div');
    el.className = 'mtab' +
      (idx === curMonth ? ' active' : '') +
      (monthCounts[idx] > 0 ? ' has-data' : '');
    el.textContent = name.substring(0,3);
    el.title = name + (monthCounts[idx] ? ` (${monthCounts[idx]})` : '');
    el.addEventListener('click', () => {
      curMonth = idx;
      document.querySelectorAll('.mtab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderCalendar();
    });
    tabs.appendChild(el);
  });
  document.getElementById('navCur').textContent = `${MONTHS_NOM[curMonth]} ${curYear}`;
}

// ══════════════════════════════════════════
//  CAT COLORS (hex for CSS var())
// ══════════════════════════════════════════
const CAT_COLORS = {
  offer:'#d4a843', bonus:'#f0c040',
  tournament:'#5ab4e0', tournament_end:'#5ab4e0',
  event:'#7acc50', fair:'#e09030',
  holiday:'#e060a0', season:'#8ab860',
  maintenance:'#808070', update:'#808070',
  auction:'#a07850', other:'#605040',
};

function catColor(c) { return CAT_COLORS[c] || '#706050'; }

// ══════════════════════════════════════════
//  WEEK LAYOUT ALGORITHM
// ══════════════════════════════════════════
function layoutWeek(weekDates, events) {
  // weekDates: 7 ISO date strings (Mon–Sun)
  const w0 = weekDates[0], w6 = weekDates[6];

  // Collect events active this week, deduplicated by id
  const seen = new Set();
  const active = [];
  for (const ev of events) {
    if (seen.has(ev.id)) continue;
    const evEnd = ev.e || ev.d;
    if (ev.d <= w6 && evEnd >= w0) { seen.add(ev.id); active.push(ev); }
  }

  // Sort: earlier start first, then longer duration first
  active.sort((a, b) => {
    if (a.d !== b.d) return a.d < b.d ? -1 : 1;
    return ((b.e||b.d) < (a.e||a.d)) ? -1 : 1;
  });

  const MAX_ROWS = 3;
  const rowTail = Array(MAX_ROWS).fill(-1); // last col used per row
  const placed = [];
  let overflow = 0;

  for (const ev of active) {
    const clampStart = ev.d < w0 ? w0 : ev.d;
    const clampEnd   = (ev.e && ev.e > w6) ? w6 : (ev.e || ev.d);
    const c1 = weekDates.indexOf(clampStart);
    const c2 = weekDates.indexOf(clampEnd);
    if (c1 === -1 || c2 === -1) continue; // shouldn't happen

    let row = -1;
    for (let r = 0; r < MAX_ROWS; r++) {
      if (rowTail[r] < c1) { row = r; break; }
    }
    if (row === -1) { overflow++; continue; }
    rowTail[row] = c2;

    placed.push({
      ev, row,
      gridCol: `${c1+1} / ${c2+2}`,
      startsHere: ev.d >= w0,
      endsHere:   !ev.e || ev.e <= w6,
    });
  }

  return { placed, overflow };
}

// ══════════════════════════════════════════
//  RENDER CALENDAR
// ══════════════════════════════════════════
function renderCalendar() {
  document.getElementById('navCur').textContent = `${MONTHS_NOM[curMonth]} ${curYear}`;
  document.querySelectorAll('.mtab').forEach((t, i) => t.classList.toggle('active', i === curMonth));

  const body = document.getElementById('calBody');
  body.innerHTML = '';

  // Build week date arrays
  const firstDate = new Date(curYear, curMonth, 1);
  let startDow = firstDate.getDay();
  startDow = startDow === 0 ? 6 : startDow - 1; // Mon=0
  const daysInMonth = new Date(curYear, curMonth + 1, 0).getDate();

  const allDates = [];
  // Prev month overflow
  const prevDays = new Date(curYear, curMonth, 0).getDate();
  for (let i = startDow - 1; i >= 0; i--) {
    allDates.push(isoDate(new Date(curYear, curMonth - 1, prevDays - i)));
  }
  for (let d = 1; d <= daysInMonth; d++) {
    allDates.push(isoDate(new Date(curYear, curMonth, d)));
  }
  // Next month overflow to fill last week
  let nd = 1;
  while (allDates.length % 7) allDates.push(isoDate(new Date(curYear, curMonth + 1, nd++)));

  // Get all visible events active in the displayed range
  const rangeStart = allDates[0], rangeEnd = allDates[allDates.length - 1];
  const monthEvents = allNews.filter(ev => {
    if (!isVisible(ev.c)) return false;
    const evEnd = ev.e || ev.d;
    return ev.d <= rangeEnd && evEnd >= rangeStart;
  });

  // Split into weeks and render
  for (let w = 0; w < allDates.length; w += 7) {
    const weekDates = allDates.slice(w, w + 7);
    const weekEl = document.createElement('div');
    weekEl.className = 'week';

    // ── Day numbers row ──
    const daysRow = document.createElement('div');
    daysRow.className = 'week-days';
    weekDates.forEach(dateStr => {
      const d = parseIso(dateStr);
      const isThis = d.getMonth() === curMonth;
      const el = document.createElement('div');
      el.className = 'wday' +
        (!isThis              ? ' other-month' : '') +
        (dateStr === TODAY_STR ? ' today'       : '') +
        (dateStr > TODAY_STR && isThis ? ' future' : '') +
        (dateStr === selectedDay ? ' selected'  : '');
      el.dataset.date = dateStr;
      el.innerHTML = `<span class="wday-num">${d.getDate()}</span>`;
      if (isThis) el.addEventListener('click', () => showDetail(dateStr));
      daysRow.appendChild(el);
    });
    weekEl.appendChild(daysRow);

    // ── Event bars ──
    const { placed, overflow } = layoutWeek(weekDates, monthEvents);
    if (placed.length || overflow) {
      const evArea = document.createElement('div');
      evArea.className = 'week-events';

      // Find max row
      const maxRow = placed.length ? Math.max(...placed.map(p => p.row)) + 1 : 0;

      placed.forEach(({ ev, row, gridCol, startsHere, endsHere }) => {
        const color = catColor(ev.c);
        const bar = document.createElement('div');
        bar.className = 'ev-bar' +
          (!startsHere ? ' ev-cont' : '') +
          (!endsHere   ? ' ev-goes' : '');
        bar.style.gridColumn = gridCol;
        bar.style.gridRow = row + 1;
        bar.style.setProperty('--color', color);
        const label = ev.t.replace(/^Акция!\s*/i,'').replace(/^Завершение\s+/i,'↩ ');
        bar.textContent = startsHere ? label : '';
        bar.title = ev.t;
        bar.addEventListener('click', e => { e.stopPropagation(); showEventDetail(ev); });
        evArea.appendChild(bar);
      });

      if (overflow) {
        const more = document.createElement('div');
        more.className = 'ev-more-row';
        more.style.gridRow = maxRow + 1;
        more.textContent = `+${overflow} ещё`;
        evArea.appendChild(more);
      }

      weekEl.appendChild(evArea);
    }

    body.appendChild(weekEl);
  }

  // Reopen detail if selected day visible
  if (selectedDay && allDates.includes(selectedDay)) {
    showDetail(selectedDay, false);
  } else if (selectedDay) {
    closeDetail();
  }
}

// ══════════════════════════════════════════
//  DETAIL PANEL
// ══════════════════════════════════════════
function detailItemHtml(n) {
  const meta = CAT_META[n.c] || CAT_META.other;
  const color = catColor(n.c);
  const durInfo = n.e ? formatDuration(n.d, n.e, n.approx) : null;
  const link = `<a href="${newsUrl(n.id)}" target="_blank" rel="noopener" class="detail-link">Новость →</a>`;
  const durHtml = durInfo
    ? `<div class="detail-duration${durInfo.approx?' approx':''}">${durInfo.range} · ${durInfo.dur}</div>`
    : '';
  return `<div class="detail-item">
    <div class="detail-ico">${meta.ico}</div>
    <div class="detail-info" style="flex:1;min-width:0">
      <div class="detail-title">${n.t}</div>
      <div class="detail-meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px">
        <span class="detail-cat-badge" style="color:${color};border-color:${color}44;background:${color}12">${meta.label}</span>
        ${link}
      </div>
      ${durHtml}
    </div>
  </div>`;
}

function openDetailPanel(title, items, scroll) {
  if (!items.length) { closeDetail(); return; }
  document.getElementById('detailDateLabel').textContent = title;
  document.getElementById('detailBody').innerHTML = items.map(detailItemHtml).join('');
  const panel = document.getElementById('detailPanel');
  panel.style.display = 'block';
  if (scroll) setTimeout(() => panel.scrollIntoView({ behavior:'smooth', block:'nearest' }), 50);
}

function showDetail(dateStr, scroll=true) {
  selectedDay = dateStr;
  document.querySelectorAll('.wday').forEach(c => c.classList.toggle('selected', c.dataset.date === dateStr));

  // All events active on this day
  const evEnd = ev => ev.e || ev.d;
  const items = allNews.filter(n => isVisible(n.c) && n.d <= dateStr && evEnd(n) >= dateStr);
  items.sort((a,b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);

  if (!items.length) { closeDetail(); return; }

  const d = parseIso(dateStr);
  const dow = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][d.getDay()];
  openDetailPanel(`${dow}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`, items, scroll);
}

function showEventDetail(ev) {
  selectedDay = ev.d;
  document.querySelectorAll('.wday').forEach(c => c.classList.toggle('selected', c.dataset.date === ev.d));
  openDetailPanel(ev.t, [ev], true);
}

function closeDetail() {
  selectedDay = null;
  document.getElementById('detailPanel').style.display = 'none';
  document.querySelectorAll('.day-cell.selected').forEach(c => c.classList.remove('selected'));
}

// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function navigate(delta) {
  let m = curMonth + delta;
  let y = curYear;
  if (m < 0)  { m = 11; y--; }
  if (m > 11) { m = 0;  y++; }
  // Check if year changed
  if (y !== curYear) {
    curYear = y;
    buildYearNav();
    buildMonthTabs();
  }
  curMonth = m;
  buildMonthTabs();
  renderCalendar();
}
document.getElementById('btnPrev').addEventListener('click', () => navigate(-1));
document.getElementById('btnNext').addEventListener('click', () => navigate(+1));
document.getElementById('detailClose').addEventListener('click', closeDetail);

// ══════════════════════════════════════════
//  NEWS URL
// ══════════════════════════════════════════
function newsUrl(id) {
  return `http://pridvornyirobot.kor.ru/blog/comments/${id}`;
}

function formatDuration(startIso, endIso, approx) {
  const s = parseIso(startIso), e = parseIso(endIso);
  const days = Math.round((e - s) / 86400000);
  const sStr = `${s.getDate()} ${MONTHS_GEN[s.getMonth()]}`;
  const eStr = `${e.getDate()} ${MONTHS_GEN[e.getMonth()]}${e.getFullYear() !== s.getFullYear() ? ' '+e.getFullYear() : ''}`;
  const dur = days === 0 ? '1 день' : days === 1 ? '2 дня' : days < 5 ? `${days+1} дня` : `${days+1} дней`;
  const prefix = approx ? '~' : '';
  return { range: `${sStr} — ${prefix}${eStr}`, dur: `${prefix}${dur}`, approx };
}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
fetch('db/news_cal.json')
  .then(r => r.json())
  .then(data => {
    allNews = data;
    buildFilters();
    buildYearNav();
    buildMonthTabs();
    renderCalendar();
  })
  .catch(err => {
    document.getElementById('calDays').innerHTML =
      '<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--txt3)">Не удалось загрузить данные</div>';
    console.error(err);
  });
</script>
